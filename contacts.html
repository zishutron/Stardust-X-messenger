<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Contacts - Stardust X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        /* ================================================================
           CONTACTS PAGE STYLES - With Dark Mode Support
           ================================================================ */
        :root {
            --primary: #00A86B;
            --primary-light: #00C97A;
            --primary-dark: #008A56;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F5F9F7;
            --bg-surface: #ECF5F0;
            --bg-input: #F0F7F3;
            --text-primary: #1A2E24;
            --text-secondary: #4A6A5A;
            --text-muted: #8AAA9A;
            --border-color: #D4E8DE;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.25s ease;
            --danger: #EF4444;
        }

        .dark-mode {
            --bg-primary: #1A1A2E;
            --bg-secondary: #0F0F1A;
            --bg-surface: #2A2A44;
            --bg-input: #22223A;
            --text-primary: #F0F0F5;
            --text-secondary: #B0B0C8;
            --text-muted: #7A7A94;
            --border-color: #33334A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .scrollbar-custom::-webkit-scrollbar { width: 3px; }
        .scrollbar-custom::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-custom::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        #app {
            max-width: 430px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 168, 107, 0.05);
        }

        .app-header {
            background: var(--bg-primary);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 54px;
        }
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .app-header .logo .icon {
            width: 34px;
            height: 34px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .app-header .logo .icon svg { width: 22px; height: 22px; }
        .app-header .logo .brand {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .app-header .logo .brand .x { color: var(--primary); }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .header-actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-actions button:active {
            background: var(--bg-surface);
            color: var(--primary);
        }

        .bottom-nav {
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 4px 0 8px;
            flex-shrink: 0;
            min-height: 56px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 12px;
            transition: var(--transition);
            font-size: 9px;
            font-weight: 500;
            min-width: 50px;
            position: relative;
        }
        .nav-item svg { width: 24px; height: 24px; transition: var(--transition); }
        .nav-item.active { color: var(--primary); }
        .nav-item.active svg { transform: translateY(-2px); }

        .search-bar {
            padding: 8px 16px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }
        .search-bar input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.12);
        }
        .search-bar input::placeholder { color: var(--text-muted); }
        .search-wrapper { position: relative; }
        .search-wrapper .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
            background: var(--bg-primary);
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 12px;
            margin: 2px 8px;
            position: relative;
        }
        .contact-item:active { background: var(--bg-surface); transform: scale(0.98); }
        .contact-item .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
            border: 2px solid var(--border-color);
            background: var(--bg-surface);
        }
        .contact-item .avatar.online { border-color: var(--primary); }
        .contact-item .info { flex: 1; min-width: 0; }
        .contact-item .info .name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .contact-item .info .name-row .name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .contact-item .info .msg-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }
        .contact-item .info .msg-row .sub {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .contact-item .item-menu-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 4px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .contact-item .item-menu-btn:active {
            background: var(--bg-surface);
            color: var(--primary);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            flex: 1;
            height: 100%;
        }
        .empty-state .icon { color: var(--text-muted); opacity: 0.3; margin-bottom: 16px; }
        .empty-state .title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .empty-state .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 280px;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            animation: toastIn 0.3s ease-out;
            max-width: 90%;
            text-align: center;
            font-size: 14px;
            display: none;
            font-weight: 500;
        }
        .toast.active { display: block; }
        @keyframes toastIn {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        #loading {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading .brand {
            margin-top: 16px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        #loading .brand .x { color: var(--primary); }

        .fab {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 168, 107, 0.3);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .fab:active { transform: scale(0.92); }
        .fab svg { width: 26px; height: 26px; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 20px;
            animation: fadeIn 0.2s ease-out;
        }
        .modal-overlay.hidden { display: none; }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .modal-box {
            background: var(--bg-primary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-box .modal-header h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .modal-box .modal-header button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: var(--transition);
            font-size: 18px;
        }
        .modal-box .modal-header button:active { background: var(--bg-surface); }
        .modal-box input {
            width: 100%;
            padding: 10px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
            margin-bottom: 10px;
        }
        .modal-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.12);
        }
        .modal-box .btn-primary {
            width: 100%;
            margin-top: 4px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 15px;
        }
        .modal-box .btn-primary:active { transform: scale(0.98); }
        .modal-box .btn-secondary {
            width: 100%;
            margin-top: 8px;
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 12px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 15px;
        }
        .modal-box .btn-secondary:active { background: var(--bg-surface); }

        /* Contact Context Menu */
        .contact-context-menu {
            position: fixed;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 6px;
            z-index: 45;
            min-width: 170px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.15s ease-out;
        }
        .contact-context-menu button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 8px 14px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            border-radius: 8px;
            transition: var(--transition);
        }
        .contact-context-menu button:active { background: var(--bg-surface); }
        .contact-context-menu .danger { color: var(--danger); }

        @media (max-width: 430px) { #app { max-width: 100%; border-radius: 0; } }
        @media (max-width: 380px) {
            .nav-item { min-width: 40px; font-size: 8px; }
            .nav-item svg { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>

    <!-- Loading -->
    <div id="loading">
        <div class="spinner"></div>
        <div class="brand">Stardust <span class="x">X</span></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <span id="toast-message">Success!</span>
    </div>

    <!-- App -->
    <div id="app">
        <header class="app-header">
            <div class="logo" onclick="window.location.href='chat.html'">
                <div class="icon">
                    <svg viewBox="0 0 40 40" fill="none">
                        <rect x="4" y="4" width="32" height="32" rx="8" fill="white" />
                        <path d="M12 20 L18 26 L30 14" stroke="#00A86B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 14 L28 14 L28 20" stroke="#00A86B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="brand">Stardust <span class="x">X</span></span>
            </div>
            <div class="header-actions">
                <button onclick="showSearch()" aria-label="Search">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/>
                    </svg>
                </button>
                <button onclick="openAddContact()" aria-label="Add contact">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                </button>
            </div>
        </header>

        <div class="search-bar">
            <div class="search-wrapper">
                <span class="search-icon">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/>
                    </svg>
                </span>
                <input type="text" id="search-input" placeholder="Search contacts..." />
            </div>
        </div>
        <div class="list-container scrollbar-custom" id="contacts-list">
            <!-- Rendered by JS -->
        </div>

        <!-- Add Contact Modal - NO CHAT OPENING -->
        <div id="add-contact-modal" class="modal-overlay hidden">
            <div class="modal-box">
                <div class="modal-header">
                    <h3>Add New Contact</h3>
                    <button onclick="closeModal('add-contact-modal')">✕</button>
                </div>
                <p style="color:var(--text-muted);font-size:13px;margin-bottom:12px;">Enter the 6-digit UID of the user you want to add.</p>
                <input type="text" id="add-contact-uid" placeholder="Enter 6-digit UID" maxlength="6" style="text-align:center;letter-spacing:4px;font-size:20px;font-weight:600;" />
                <div id="contact-preview" style="display:none;margin-top:12px;padding:12px;background:var(--bg-surface);border-radius:var(--radius-sm);border:1px solid var(--border-color);">
                    <div style="display:flex;align-items:center;gap:12px;">
                        <img id="preview-avatar" src="" alt="Avatar" style="width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--border-color);" />
                        <div style="flex:1;">
                            <div id="preview-name" style="font-weight:600;font-size:15px;">Name</div>
                            <div id="preview-uid" style="font-size:12px;color:var(--text-muted);">@000000</div>
                        </div>
                        <button class="btn-primary" style="margin:0;padding:6px 16px;width:auto;" onclick="confirmAddContact()">Add Contact</button>
                        <button class="btn-secondary" style="margin:0;padding:6px 16px;width:auto;" onclick="closeModal('add-contact-modal')">Cancel</button>
                    </div>
                </div>
                <button class="btn-primary" onclick="searchContact()">Search</button>
            </div>
        </div>

        <button class="fab" onclick="openAddContact()" aria-label="Add contact">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
        </button>

        <nav class="bottom-nav">
            <button class="nav-item" data-tab="chats" onclick="window.location.href='chat.html'">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
                <span>Chats</span>
            </button>
            <button class="nav-item active" data-tab="contacts" onclick="window.location.href='contacts.html'">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
                <span>Contacts</span>
            </button>
        </nav>
    </div>

    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyC0v1HVCDfyO-nFdBJChpcB3ZxDOlCtFuQ",
            authDomain: "stardust-chat-1656d.firebaseapp.com",
            databaseURL: "https://stardust-chat-1656d-default-rtdb.firebaseio.com",
            projectId: "stardust-chat-1656d",
            storageBucket: "stardust-chat-1656d.firebasestorage.app",
            messagingSenderId: "676902329820",
            appId: "1:676902329820:web:576bb7bc0e6c9d3e0c4319",
            measurementId: "G-31GVGLYZDL"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // ================================================================
        // STATE
        // ================================================================
        const state = {
            currentUser: null,
            uid: null,
            contacts: [],
            blocked: [],
            closeFriends: [],
            pendingContactUID: null,
        };

        // ================================================================
        // DARK MODE
        // ================================================================
        function applyDarkMode() {
            const saved = localStorage.getItem('stardust-dark-mode');
            if (saved === 'true') {
                document.body.classList.add('dark-mode');
            }
        }
        applyDarkMode();

        // ================================================================
        // TOAST
        // ================================================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.add('active');
            if (window.toastTimeout) clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function showSearch() {
            document.getElementById('search-input').focus();
        }

        // ================================================================
        // AUTH CHECK
        // ================================================================
        auth.onAuthStateChanged((user) => {
            document.getElementById('loading').style.display = 'none';

            if (!user) {
                window.location.href = 'auth.html';
                return;
            }

            db.ref('users').orderByChild('email').equalTo(user.email)
                .once('value')
                .then((snap) => {
                    const data = snap.val();
                    if (data) {
                        const keys = Object.keys(data);
                        for (let k of keys) {
                            if (data[k].email === user.email) {
                                state.currentUser = data[k];
                                state.uid = k;
                                state.blocked = data[k].blocked || [];
                                state.closeFriends = data[k].closeFriends || [];
                                break;
                            }
                        }
                    }
                    if (state.currentUser) {
                        initializeApp();
                    }
                });
        });

        // ================================================================
        // INITIALIZE
        // ================================================================
        function initializeApp() {
            db.ref('users/' + state.uid + '/contacts').on('value', (snap) => {
                state.contacts = snap.val() || [];
                renderContactsList();
            });

            db.ref('users/' + state.uid + '/blocked').on('value', (snap) => {
                state.blocked = snap.val() || [];
                renderContactsList();
            });

            db.ref('users/' + state.uid + '/closeFriends').on('value', (snap) => {
                state.closeFriends = snap.val() || [];
                renderContactsList();
            });

            document.getElementById('search-input')?.addEventListener('input', (e) => {
                filterContactsList(e.target.value);
            });

            renderContactsList();
            showToast('Welcome, ' + state.currentUser.name + '!');
        }

        // ================================================================
        // RENDER CONTACTS
        // ================================================================
        function renderContactsList() {
            const container = document.getElementById('contacts-list');
            container.innerHTML = '';

            const contacts = state.contacts.filter(c => !state.blocked.includes(c));

            if (contacts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">
                            <svg width="56" height="56" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                            </svg>
                        </div>
                        <div class="title">No Contacts</div>
                        <div class="subtitle">Add contacts using the + button</div>
                    </div>
                `;
                return;
            }

            contacts.forEach(uid => {
                db.ref('users/' + uid).once('value').then((snap) => {
                    const contact = snap.val();
                    if (!contact) return;

                    const isCloseFriend = state.closeFriends.includes(uid);

                    const div = document.createElement('div');
                    div.className = 'contact-item';

                    // Click opens chat
                    const mainClick = () => {
                        window.location.href = 'chat.html?uid=' + uid;
                    };
                    div.addEventListener('click', mainClick);

                    // Long press for context menu
                    let longPressTimer;
                    div.addEventListener('touchstart', () => {
                        longPressTimer = setTimeout(() => {
                            showContactContextMenu(0, 0, uid, contact.name);
                        }, 600);
                    });
                    div.addEventListener('touchend', () => clearTimeout(longPressTimer));
                    div.addEventListener('touchmove', () => clearTimeout(longPressTimer));
                    div.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        showContactContextMenu(e.clientX, e.clientY, uid, contact.name);
                    });

                    div.innerHTML = `
                        <img src="${contact.pfp}" alt="${contact.name}" class="avatar ${contact.online ? 'online' : ''}" />
                        <div class="info">
                            <div class="name-row">
                                <span class="name">${contact.name} ${isCloseFriend ? '⭐' : ''}</span>
                            </div>
                            <div class="msg-row">
                                <span class="sub">UID: ${uid} · ${contact.online ? 'Online' : 'Offline'}</span>
                            </div>
                        </div>
                        <button class="item-menu-btn" onclick="event.stopPropagation();openContactMenu('${uid}')">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
                            </svg>
                        </button>
                    `;
                    container.appendChild(div);
                });
            });
        }

        function filterContactsList(query) {
            const items = document.querySelectorAll('#contacts-list .contact-item');
            const q = query.toLowerCase().trim();
            items.forEach(item => {
                const name = item.querySelector('.name')?.textContent?.toLowerCase() || '';
                const uid = item.querySelector('.sub')?.textContent?.toLowerCase() || '';
                item.style.display = name.includes(q) || uid.includes(q) ? 'flex' : 'none';
            });
        }

        // ================================================================
        // CONTACT CONTEXT MENU
        // ================================================================
        function showContactContextMenu(x, y, uid, name) {
            document.querySelectorAll('.contact-context-menu').forEach(el => el.remove());

            const menu = document.createElement('div');
            menu.className = 'contact-context-menu';

            if (x === 0) {
                menu.style.left = '50%';
                menu.style.top = '50%';
                menu.style.transform = 'translate(-50%, -50%)';
            } else {
                menu.style.left = Math.min(x, window.innerWidth - 200) + 'px';
                menu.style.top = Math.min(y, window.innerHeight - 200) + 'px';
            }

            const isCloseFriend = state.closeFriends.includes(uid);

            menu.innerHTML = `
                <button onclick="deleteContact('${uid}')" class="danger">Delete Contact</button>
                <button onclick="blockContact('${uid}')">Block Contact</button>
                <button onclick="toggleCloseFriendContact('${uid}')">${isCloseFriend ? 'Remove Close Friend' : 'Add to Close Friend'}</button>
                <button onclick="reportContact('${uid}', '${name}')">Report</button>
            `;

            document.body.appendChild(menu);

            setTimeout(() => {
                document.addEventListener('click', closeContactContextMenu);
            }, 10);
        }

        function closeContactContextMenu(e) {
            if (!e.target.closest('.contact-context-menu')) {
                document.querySelectorAll('.contact-context-menu').forEach(el => el.remove());
                document.removeEventListener('click', closeContactContextMenu);
            }
        }

        // ================================================================
        // CONTACT ACTIONS
        // ================================================================
        function deleteContact(uid) {
            if (!confirm('Delete this contact permanently?')) return;
            state.contacts = state.contacts.filter(c => c !== uid);
            db.ref('users/' + state.uid + '/contacts').set(state.contacts);
            document.querySelectorAll('.contact-context-menu').forEach(el => el.remove());
            showToast('Contact deleted permanently');
            renderContactsList();
        }

        function blockContact(uid) {
            if (!confirm('Block this contact?')) return;
            if (!state.blocked.includes(uid)) {
                state.blocked.push(uid);
                db.ref('users/' + state.uid + '/blocked').set(state.blocked);
                state.contacts = state.contacts.filter(c => c !== uid);
                db.ref('users/' + state.uid + '/contacts').set(state.contacts);
                document.querySelectorAll('.contact-context-menu').forEach(el => el.remove());
                showToast('Contact blocked');
                renderContactsList();
            }
        }

        function toggleCloseFriendContact(uid) {
            if (state.closeFriends.includes(uid)) {
                state.closeFriends = state.closeFriends.filter(c => c !== uid);
                showToast('Removed from close friends');
            } else {
                state.closeFriends.push(uid);
                showToast('Added to close friends');
            }
            db.ref('users/' + state.uid + '/closeFriends').set(state.closeFriends);
            document.querySelectorAll('.contact-context-menu').forEach(el => el.remove());
            renderContactsList();
        }

        function reportContact(uid, name) {
            const reason = prompt(`Please enter the reason for reporting ${name}:`);
            if (!reason) return;

            const reportRef = db.ref('reports');
            reportRef.push({
                reporterUID: state.uid,
                reporterName: state.currentUser.name,
                reportedUID: uid,
                reportedName: name,
                reason: reason,
                timestamp: Date.now(),
                status: 'pending'
            }).then(() => {
                document.querySelectorAll('.contact-context-menu').forEach(el => el.remove());
                showToast('Report submitted to admin');
            }).catch((err) => {
                showToast('Error: ' + err.message);
            });
        }

        // ================================================================
        // ADD CONTACT - NO CHAT OPENING
        // ================================================================
        window.openAddContact = function() {
            document.getElementById('add-contact-modal').classList.remove('hidden');
            document.getElementById('add-contact-uid').value = '';
            document.getElementById('contact-preview').style.display = 'none';
            document.getElementById('add-contact-uid').focus();
        };

        window.searchContact = function() {
            const uid = document.getElementById('add-contact-uid').value.trim();
            const preview = document.getElementById('contact-preview');

            if (!uid || uid.length !== 6) {
                showToast('Please enter a valid 6-digit UID');
                return;
            }

            if (uid === state.uid) {
                showToast('You cannot add yourself');
                return;
            }

            if (state.contacts.includes(uid)) {
                showToast('Already in contacts');
                closeModal('add-contact-modal');
                return;
            }

            if (state.blocked.includes(uid)) {
                showToast('This user is blocked');
                return;
            }

            db.ref('users/' + uid).once('value').then((snap) => {
                const user = snap.val();
                if (!user) {
                    showToast('User not found');
                    return;
                }

                state.pendingContactUID = uid;
                document.getElementById('preview-avatar').src = user.pfp ||
                    'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name) +
                    '&background=00A86B&color=fff&size=72';
                document.getElementById('preview-name').textContent = user.name;
                document.getElementById('preview-uid').textContent = '@' + uid;
                preview.style.display = 'block';
            });
        };

        window.confirmAddContact = function() {
            const uid = state.pendingContactUID;
            if (!uid) return;

            // Add to contacts - NO CHAT OPENING
            if (!state.contacts.includes(uid)) {
                state.contacts.push(uid);
                db.ref('users/' + state.uid + '/contacts').set(state.contacts);
                closeModal('add-contact-modal');
                showToast('✅ Contact added successfully!');
                renderContactsList();

                // Send notification to the added user
                const notifRef = db.ref('notifications/' + uid);
                notifRef.push({
                    id: 'notif_' + Date.now(),
                    type: 'contact_added',
                    message: state.currentUser.name + ' added you as a contact',
                    timestamp: Date.now(),
                    read: false,
                    sourceUserId: state.uid,
                    isContactAdd: true
                });
            } else {
                showToast('Already in contacts');
                closeModal('add-contact-modal');
            }
        };

        console.log('🚀 Stardust X - Contacts Page (Fixed)');
        console.log('✅ Add contact without opening chat');
        console.log('✅ Contact persists until deleted');
        console.log('✅ Tap contact to open chat');
        console.log('✅ Dark mode works');
    </script>
</body>
</html>
