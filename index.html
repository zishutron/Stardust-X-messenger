<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Stardust X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #FFFFFF;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .splash {
            text-align: center;
            animation: fadeIn 1s ease-in;
        }
        .splash .icon {
            width: 80px;
            height: 80px;
            background: #00A86B;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .splash .icon svg {
            width: 48px;
            height: 48px;
        }
        .splash .brand {
            font-size: 28px;
            font-weight: 700;
            color: #1A2E24;
            letter-spacing: -0.5px;
        }
        .splash .brand .x {
            color: #00A86B;
        }
        .splash .sub {
            font-size: 14px;
            color: #8AAA9A;
            margin-top: 4px;
        }
        .spinner {
            margin-top: 24px;
            width: 32px;
            height: 32px;
            border: 3px solid #D4E8DE;
            border-top-color: #00A86B;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="splash">
        <div class="icon">
            <svg viewBox="0 0 40 40" fill="none">
                <rect x="4" y="4" width="32" height="32" rx="8" fill="white" />
                <path d="M12 20 L18 26 L30 14" stroke="#00A86B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M22 14 L28 14 L28 20" stroke="#00A86B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="brand">Stardust <span class="x">X</span></div>
        <div class="sub">Secure messaging for everyone</div>
        <div class="spinner"></div>
    </div>
    <script>
        // Redirect to auth page after loading
        setTimeout(() => {
            window.location.href = 'auth.html';
        }, 1500);
    </script>
</body>
</html>
