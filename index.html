<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>StarChat - Secure Messaging</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b1528;
            color: #f1f5f9;
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Scrollbar */
        .scrollbar-custom::-webkit-scrollbar {
            width: 3px;
        }
        .scrollbar-custom::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollbar-custom::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        /* Chat Bubble Styles */
        .bubble-sent {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .bubble-received {
            background: #1e293b;
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
        }

        /* Media Preview */
        .media-preview {
            border-radius: 12px;
            overflow: hidden;
            max-width: 200px;
            border: 1px solid #334155;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .media-preview:hover {
            transform: scale(1.02);
        }
        .media-preview img,
        .media-preview video {
            width: 100%;
            height: auto;
            max-height: 150px;
            object-fit: cover;
        }
        .media-preview .media-label {
            padding: 4px 8px;
            font-size: 9px;
            text-align: center;
            background: #0f172a;
            color: #94a3b8;
        }

        /* Contact Item */
        .contact-item {
            transition: background 0.2s;
            cursor: pointer;
        }
        .contact-item:hover {
            background: #1e293b;
        }

        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fab:hover {
            transform: scale(1.05);
        }
        .fab:active {
            transform: scale(0.95);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #065f46;
            color: white;
            padding: 14px 24px;
            border-radius: 16px;
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            animation: toastIn 0.4s ease-out;
            max-width: 90%;
            text-align: center;
            border: 1px solid #34d399;
        }
        .toast.hidden {
            display: none;
        }
        @keyframes toastIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Spinner */
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.1);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border-left-color: #fff;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Status Indicator */
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-online {
            background: #22c55e;
        }
        .status-offline {
            background: #64748b;
        }

        /* Active Tab */
        .tab-active {
            color: #2563eb;
            border-bottom: 2px solid #2563eb;
        }
        .tab-inactive {
            color: #64748b;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 20px;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal-box {
            background: #1e293b;
            border-radius: 24px;
            border: 1px solid #334155;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        /* Full Screen Media Viewer */
        #media-viewer {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #media-viewer.hidden {
            display: none;
        }
        #media-viewer img,
        #media-viewer video {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
        }

        /* Call Overlay */
        #call-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #0a0a0a 0%, #000000 100%);
            z-index: 70;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
        }
        #call-overlay.hidden {
            display: none;
        }
        .call-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #06b6d4;
            box-shadow: 0 0 60px rgba(6, 182, 212, 0.3);
            object-fit: cover;
        }
        .call-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .call-btn:hover {
            transform: scale(1.05);
        }
        .call-btn:active {
            transform: scale(0.95);
        }
        .call-btn-end {
            background: #dc2626;
            color: white;
        }
        .call-btn-mute {
            background: #334155;
            color: white;
        }
        .call-btn-video {
            background: #334155;
            color: white;
        }

        /* Floating minimized call */
        #floating-call {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 140px;
            height: 180px;
            border-radius: 16px;
            overflow: hidden;
            z-index: 40;
            background: #0f172a;
            border: 1px solid #334155;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            cursor: grab;
        }
        #floating-call.hidden {
            display: none;
        }
        #floating-call video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #floating-call .caller-info {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 10px;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: bold;
            text-align: center;
        }
        #floating-call .call-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
        }
        #floating-call .call-actions button {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
        }

        /* Selected contact highlight */
        .contact-selected {
            background: #1e293b;
            border-left: 3px solid #2563eb;
        }

        /* File input hidden */
        .file-input-hidden {
            display: none;
        }

        /* Profile pic upload */
        .profile-pic-wrapper {
            position: relative;
            display: inline-block;
        }
        .profile-pic-wrapper .upload-overlay {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #2563eb;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid #0b1528;
        }

        /* Scrollable chat messages */
        #messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 16px;
            background: #1e293b;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
            animation: typing 1.4s infinite both;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typing {
            0%,
            60%,
            100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-8px);
            }
        }
    </style>
</head>
<body>

    <!-- ===== APP CONTAINER ===== -->
    <div id="app" class="h-screen flex flex-col max-w-md mx-auto w-full bg-darkbg relative border-x border-slate-900 shadow-2xl">

        <!-- ===== HEADER ===== -->
        <header class="bg-darkcard border-b border-slate-900 p-4 flex justify-between items-center flex-shrink-0">
            <div class="flex items-center gap-3">
                <svg class="w-8 h-8 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z" />
                    <path d="M2 17l10 5 10-5" />
                    <path d="M2 12l10 5 10-5" />
                </svg>
                <h1 class="text-xl font-black tracking-tight text-white">Star<span class="text-blue-500">Chat</span></h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleTheme()" class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 transition" id="theme-btn">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
                <button onclick="logoutUser()" class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 transition">
                    <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- ===== MAIN CONTENT ===== -->
        <div class="flex-1 overflow-hidden flex flex-col">

            <!-- ===== CHAT LIST VIEW ===== -->
            <div id="chat-list-view" class="flex-1 flex flex-col">
                <!-- Search Bar -->
                <div class="p-3 bg-darkcard/50 border-b border-slate-900">
                    <input type="text" id="search-input" placeholder="Search chats or contacts..." class="w-full px-4 py-2 bg-darkbg border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-blue-500 transition text-white placeholder-slate-500" />
                </div>

                <!-- Chat List -->
                <div id="chat-list" class="flex-1 overflow-y-auto scrollbar-custom p-2 space-y-1">
                    <!-- Rendered by JS -->
                </div>

                <!-- FAB: New Chat -->
                <button class="fab" onclick="openContactPicker()">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                    </svg>
                </button>
            </div>

            <!-- ===== CHAT WINDOW VIEW ===== -->
            <div id="chat-window-view" class="hidden flex-1 flex-col">
                <!-- Chat Header -->
                <div class="bg-darkcard border-b border-slate-900 p-3 flex items-center justify-between flex-shrink-0">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="viewContactProfile(activeChatUID)">
                        <img id="chat-contact-avatar" src="" class="w-10 h-10 rounded-full object-cover border border-slate-700" />
                        <div>
                            <p id="chat-contact-name" class="font-bold text-sm text-white">Contact</p>
                            <p id="chat-contact-status" class="text-xs text-slate-400">offline</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="startCall('audio')" class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 transition" title="Audio Call">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                            </svg>
                        </button>
                        <button onclick="startCall('video')" class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 transition" title="Video Call">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                        </button>
                        <button onclick="closeChatWindow()" class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Messages -->
                <div id="messages-container" class="flex-1 overflow-y-auto scrollbar-custom"></div>

                <!-- Typing Indicator -->
                <div id="typing-indicator" class="hidden px-4 py-1">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="bg-darkcard border-t border-slate-900 p-3 flex items-center gap-2 flex-shrink-0">
                    <button onclick="document.getElementById('file-input').click()" class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 4.5" />
                        </svg>
                    </button>
                    <input type="file" id="file-input" class="file-input-hidden" accept="image/*,video/*,.pdf,.doc,.docx,.txt" multiple />
                    <input type="text" id="message-input" placeholder="Type a message..." class="flex-1 px-4 py-2 bg-darkbg border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-blue-500 transition text-white placeholder-slate-500" />
                    <button onclick="sendMessage()" class="p-2 rounded-full bg-blue-600 hover:bg-blue-700 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                    </button>
                </div>
            </div>

        </div>

        <!-- ===== BOTTOM NAV ===== -->
        <nav class="bg-darkcard border-t border-slate-900 h-14 flex items-center justify-around flex-shrink-0">
            <button onclick="switchView('chats')" id="tab-chats" class="flex flex-col items-center text-blue-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
                <span class="text-[10px]">Chats</span>
            </button>
            <button onclick="switchView('contacts')" id="tab-contacts" class="flex flex-col items-center text-slate-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span class="text-[10px]">Contacts</span>
            </button>
            <button onclick="switchView('profile')" id="tab-profile" class="flex flex-col items-center text-slate-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span class="text-[10px]">Profile</span>
            </button>
        </nav>
    </div>

    <!-- ===== CONTACT PICKER MODAL ===== -->
    <div id="contact-picker" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-white">New Chat</h3>
                <button onclick="closeModal('contact-picker')" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <input type="text" id="contact-search" placeholder="Search contacts..." class="w-full px-4 py-2 bg-darkbg border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-blue-500 transition text-white placeholder-slate-500 mb-4" />
            <div id="contact-picker-list" class="max-h-64 overflow-y-auto scrollbar-custom space-y-1"></div>
            <div class="mt-4 border-t border-slate-800 pt-4">
                <button onclick="openAddContact()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-sm font-bold transition flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                    </svg>
                    Add New Contact
                </button>
            </div>
        </div>
    </div>

    <!-- ===== ADD CONTACT MODAL ===== -->
    <div id="add-contact-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-white">Add New Contact</h3>
                <button onclick="closeModal('add-contact-modal')" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <p class="text-xs text-slate-400 mb-4">Enter the 6-digit UID of the user you want to add.</p>
            <input type="text" id="add-contact-uid" placeholder="Enter 6-digit UID" class="w-full px-4 py-2 bg-darkbg border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-blue-500 transition text-white placeholder-slate-500 mb-4 text-center tracking-widest text-lg" maxlength="6" />
            <button onclick="addContactByUID()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-sm font-bold transition">Add Contact</button>
        </div>
    </div>

    <!-- ===== CONTACT PROFILE MODAL ===== -->
    <div id="contact-profile-modal" class="modal-overlay hidden">
        <div class="modal-box text-center">
            <div class="flex justify-end mb-2">
                <button onclick="closeModal('contact-profile-modal')" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <img id="profile-modal-avatar" src="" class="w-24 h-24 rounded-full mx-auto mb-3 border-2 border-slate-700 object-cover" />
            <h3 id="profile-modal-name" class="text-lg font-bold text-white">Name</h3>
            <p id="profile-modal-uid" class="text-xs text-slate-400 font-mono">@000000</p>
            <p id="profile-modal-bio" class="text-sm text-slate-300 mt-3"></p>
            <div class="mt-4 flex gap-2 justify-center">
                <button onclick="closeModal('contact-profile-modal'); startChatWithContact(activeProfileUID)" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                    </svg>
                    Message
                </button>
                <button onclick="startCallWithContact(activeProfileUID, 'audio')" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">

    <!-- ============================================================ -->
    <!-- ===== FIREBASE + APPLICATION LOGIC ===== -->
    <!-- ============================================================ -->
    <script type="module">
        // ================================================================
        // FIREBASE CONFIG - Provided by User
        // ================================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, push, update, get, remove, runTransaction, onChildAdded, onChildChanged, onChildRemoved } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC0v1HVCDfyO-nFdBJChpcB3ZxDOlCtFuQ",
            authDomain: "stardust-chat-1656d.firebaseapp.com",
            databaseURL: "https://stardust-chat-1656d-default-rtdb.firebaseio.com",
            projectId: "stardust-chat-1656d",
            storageBucket: "stardust-chat-1656d.firebasestorage.app",
            messagingSenderId: "676902329820",
            appId: "1:676902329820:web:576bb7bc0e6c9d3e0c4319",
            measurementId: "G-31GVGLYZDL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const storage = getStorage(app);

        // ================================================================
        // STATE
        // ================================================================
        const state = {
            currentUser: null,
            contacts: [], // [{uid, name, pfp, bio, status}]
            chats: [], // [{uid, name, pfp, lastMessage, lastMessageTime, unreadCount}]
            messages: {}, // {threadKey: [{id, sender, text, timestamp, mediaType, mediaUrl}]}
            activeChatUID: null,
            activeThreadKey: null,
            isCallActive: false,
            callType: null, // 'audio' | 'video'
            isMuted: false,
            isVideoOff: false,
            localStream: null,
            remoteStream: null,
            peerConnection: null,
            typingTimeout: null,
            isTyping: false,
            theme: 'dark'
        };

        // ================================================================
        // THEME
        // ================================================================
        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            applyTheme();
        }

        function applyTheme() {
            const body = document.body;
            if (state.theme === 'dark') {
                body.style.background = '#0b1528';
                body.style.color = '#f1f5f9';
                document.getElementById('theme-btn').innerHTML =
                    `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>`;
            } else {
                body.style.background = '#f0f2f5';
                body.style.color = '#1a1a2e';
                document.getElementById('theme-btn').innerHTML =
                    `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`;
            }
            // Update all dynamic elements
            document.querySelectorAll('.bubble-sent, .bubble-received, .modal-box, .contact-item, .fab')
                .forEach(el => {
                    // Will be re-rendered
                });
        }

        // ================================================================
        // AUTH
        // ================================================================
        function generateUID() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        // Auto-login with demo or show login
        function showLoginScreen() {
            // Simple login - we'll use a modal approach
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = 'login-modal';
            modal.innerHTML = `
                <div class="modal-box">
                    <h2 class="text-xl font-bold text-white text-center mb-4">StarChat</h2>
                    <p class="text-xs text-slate-400 text-center mb-6">Sign in or create an account</p>
                    <div class="space-y-3">
                        <input type="email" id="login-email" placeholder="Email" class="w-full px-4 py-2 bg-darkbg border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-blue-500 transition text-white placeholder-slate-500" />
                        <input type="password" id="login-password" placeholder="Password" class="w-full px-4 py-2 bg-darkbg border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-blue-500 transition text-white placeholder-slate-500" />
                        <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-sm font-bold transition">Sign In</button>
                        <button onclick="handleSignup()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-sm font-bold transition">Create Account</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        window.handleLogin = function() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            if (!email || !password) {
                showToast('Please fill in all fields');
                return;
            }
            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    document.getElementById('login-modal').remove();
                })
                .catch((err) => {
                    showToast('Login failed: ' + err.message);
                });
        };

        window.handleSignup = function() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            if (!email || !password) {
                showToast('Please fill in all fields');
                return;
            }
            if (password.length < 6) {
                showToast('Password must be at least 6 characters');
                return;
            }
            createUserWithEmailAndPassword(auth, email, password)
                .then((cred) => {
                    const uid = generateUID();
                    const userData = {
                        uid: uid,
                        name: email.split('@')[0],
                        email: email,
                        bio: 'Hello, I\'m on StarChat!',
                        pfp: '',
                        contacts: [],
                        createdAt: Date.now()
                    };
                    return set(ref(db, 'users/' + uid), userData).then(() => {
                        return updateProfile(cred.user, { displayName: userData.name });
                    });
                })
                .then(() => {
                    document.getElementById('login-modal').remove();
                    showToast('Account created successfully!');
                })
                .catch((err) => {
                    showToast('Signup failed: ' + err.message);
                });
        };

        // ================================================================
        // USER STATE
        // ================================================================
        onAuthStateChanged(auth, (user) => {
            document.getElementById('loading-screen').classList.add('hidden');
            if (user) {
                // Fetch user data
                onValue(ref(db, 'users'), (snap) => {
                    const data = snap.val();
                    if (data) {
                        const found = Object.values(data).find(u => u.email === user.email);
                        if (found) {
                            state.currentUser = found;
                            initializeAppState();
                        } else {
                            // User exists in auth but not in DB - create
                            const uid = generateUID();
                            const userData = {
                                uid: uid,
                                name: user.displayName || user.email.split('@')[0],
                                email: user.email,
                                bio: 'Hello, I\'m on StarChat!',
                                pfp: '',
                                contacts: [],
                                createdAt: Date.now()
                            };
                            set(ref(db, 'users/' + uid), userData).then(() => {
                                state.currentUser = userData;
                                initializeAppState();
                            });
                        }
                    }
                });
            } else {
                showLoginScreen();
            }
        });

        // ================================================================
        // INIT APP
        // ================================================================
        function initializeAppState() {
            if (!state.currentUser) return;

            // Load contacts
            const userRef = ref(db, 'users/' + state.currentUser.uid);
            onValue(userRef, (snap) => {
                const data = snap.val();
                if (data) {
                    state.currentUser = { ...state.currentUser, ...data };
                    state.contacts = data.contacts || [];
                    renderContacts();
                    renderProfile();
                    renderChatList();
                }
            });

            // Load all users for contact search
            onValue(ref(db, 'users'), (snap) => {
                const data = snap.val();
                if (data) {
                    const allUsers = Object.values(data);
                    // Store for contact search
                    window._allUsers = allUsers;
                }
            });

            // Load chat threads
            onValue(ref(db, 'chats'), (snap) => {
                const data = snap.val();
                if (data) {
                    // Build chat list from threads
                    const myUID = state.currentUser.uid;
                    const threadKeys = Object.keys(data);
                    const chatMap = {};

                    threadKeys.forEach(key => {
                        if (key.includes(myUID)) {
                            const parts = key.split('_text_');
                            const otherUID = parts[0] === myUID ? parts[1] : parts[0];
                            const messages = data[key];
                            const msgArray = Object.values(messages);
                            if (msgArray.length > 0) {
                                const lastMsg = msgArray[msgArray.length - 1];
                                const unread = msgArray.filter(m => m.sender !== myUID && !m.seen).length;
                                const contact = state.contacts.find(c => c.uid === otherUID);
                                if (contact) {
                                    chatMap[otherUID] = {
                                        uid: otherUID,
                                        name: contact.name,
                                        pfp: contact.pfp,
                                        lastMessage: lastMsg.text || (lastMsg.mediaType ? '📎 Media' : ''),
                                        lastMessageTime: lastMsg.timestamp,
                                        unreadCount: unread,
                                        threadKey: key
                                    };
                                }
                            }
                        }
                    });

                    state.chats = Object.values(chatMap).sort((a, b) => (b.lastMessageTime || 0) - (a.lastMessageTime || 0));
                    renderChatList();

                    // If active chat is open, reload messages
                    if (state.activeChatUID && state.activeThreadKey) {
                        loadMessages(state.activeThreadKey);
                    }
                }
            });
        }

        // ================================================================
        // RENDER CHAT LIST
        // ================================================================
        function renderChatList() {
            const container = document.getElementById('chat-list');
            container.innerHTML = '';

            if (state.chats.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-slate-500 text-sm py-12">
                        <svg class="w-16 h-16 mx-auto mb-4 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                        </svg>
                        <p>No chats yet</p>
                        <p class="text-xs mt-1">Tap the + button to start a new chat</p>
                    </div>
                `;
                return;
            }

            state.chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `contact-item p-3 rounded-xl flex items-center gap-3 ${state.activeChatUID === chat.uid ? 'contact-selected' : ''}`;
                div.onclick = () => openChat(chat.uid);

                const timeStr = chat.lastMessageTime ? new Date(chat.lastMessageTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

                div.innerHTML = `
                    <img src="${chat.pfp || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(chat.name) + '&background=2563eb&color=fff'}" class="w-12 h-12 rounded-full object-cover border border-slate-700 flex-shrink-0" />
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-center">
                            <p class="font-bold text-sm text-white truncate">${chat.name}</p>
                            <span class="text-xs text-slate-500 flex-shrink-0">${timeStr}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <p class="text-sm text-slate-400 truncate">${chat.lastMessage || 'Start chatting...'}</p>
                            ${chat.unreadCount > 0 ? `<span class="bg-blue-600 text-white text-xs font-bold rounded-full px-2 py-0.5 flex-shrink-0">${chat.unreadCount}</span>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // ================================================================
        // RENDER CONTACTS
        // ================================================================
        function renderContacts() {
            const container = document.getElementById('profile-contacts-list');
            if (!container) return;
            container.innerHTML = '';

            if (!state.contacts || state.contacts.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-500 text-sm py-4">No contacts added yet</p>`;
                return;
            }

            state.contacts.forEach(contact => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-3 p-2 rounded-xl hover:bg-slate-800/50 transition cursor-pointer';
                div.onclick = () => startChatWithContact(contact.uid);

                div.innerHTML = `
                    <img src="${contact.pfp || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(contact.name) + '&background=2563eb&color=fff'}" class="w-8 h-8 rounded-full object-cover border border-slate-700" />
                    <div class="flex-1">
                        <p class="text-sm font-medium text-white">${contact.name}</p>
                        <p class="text-xs text-slate-400">@${contact.uid}</p>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // ================================================================
        // RENDER PROFILE
        // ================================================================
        function renderProfile() {
            const user = state.currentUser;
            if (!user) return;

            document.getElementById('profile-avatar').src = user.pfp ||
                'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name) + '&background=2563eb&color=fff';
            document.getElementById('profile-name').textContent = user.name;
            document.getElementById('profile-uid-display').textContent = '@' + user.uid;
            document.getElementById('profile-bio').textContent = user.bio || 'No bio yet';
        }

        // ================================================================
        // NAVIGATION
        // ================================================================
        function switchView(view) {
            const tabs = ['chats', 'contacts', 'profile'];
            tabs.forEach(t => {
                const tabBtn = document.getElementById('tab-' + t);
                if (t === view) {
                    tabBtn.className = 'flex flex-col items-center text-blue-500';
                } else {
                    tabBtn.className = 'flex flex-col items-center text-slate-500';
                }
            });

            document.getElementById('chat-list-view').style.display = view === 'chats' ? 'flex' : 'none';
            document.getElementById('chat-window-view').classList.toggle('hidden', view !== 'chats');
            document.getElementById('profile-view').classList.toggle('hidden', view !== 'profile');

            if (view === 'contacts') {
                renderContactsView();
            }

            if (view === 'profile') {
                renderProfile();
                renderContacts();
            }
        }

        function renderContactsView() {
            // Show contacts in the chat list view
            const container = document.getElementById('chat-list');
            container.innerHTML = '';

            const allUsers = window._allUsers || [];
            const myUID = state.currentUser.uid;
            const contacts = state.contacts || [];

            // Show contacts with a special header
            if (contacts.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-slate-500 text-sm py-12">
                        <svg class="w-16 h-16 mx-auto mb-4 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        <p>No contacts yet</p>
                        <p class="text-xs mt-1">Add contacts using the + button</p>
                    </div>
                `;
                return;
            }

            contacts.forEach(contact => {
                const div = document.createElement('div');
                div.className = 'contact-item p-3 rounded-xl flex items-center gap-3';
                div.onclick = () => startChatWithContact(contact.uid);

                div.innerHTML = `
                    <img src="${contact.pfp || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(contact.name) + '&background=2563eb&color=fff'}" class="w-12 h-12 rounded-full object-cover border border-slate-700 flex-shrink-0" />
                    <div class="flex-1 min-w-0">
                        <p class="font-bold text-sm text-white">${contact.name}</p>
                        <p class="text-xs text-slate-400 font-mono">@${contact.uid}</p>
                        <p class="text-xs text-slate-500">${contact.bio || 'Hey there!'}</p>
                    </div>
                `;
                container.appendChild(div);
            });

            // Add a "Add Contact" button at the bottom
            const addBtn = document.createElement('div');
            addBtn.className = 'p-3 rounded-xl border border-dashed border-slate-700 text-center cursor-pointer hover:border-blue-500 transition mt-2';
            addBtn.onclick = openAddContact;
            addBtn.innerHTML = `
                <span class="text-blue-400 font-bold text-sm">+ Add New Contact</span>
            `;
            container.appendChild(addBtn);
        }

        // ================================================================
        // CONTACT PICKER
        // ================================================================
        window.openContactPicker = function() {
            const modal = document.getElementById('contact-picker');
            modal.classList.remove('hidden');
            renderContactPickerList();
        };

        function renderContactPickerList(filter = '') {
            const container = document.getElementById('contact-picker-list');
            container.innerHTML = '';

            const allUsers = window._allUsers || [];
            const myUID = state.currentUser.uid;
            const contacts = state.contacts || [];
            const contactUIDs = contacts.map(c => c.uid);

            const available = allUsers.filter(u =>
                u.uid !== myUID &&
                !contactUIDs.includes(u.uid) &&
                (u.name.toLowerCase().includes(filter.toLowerCase()) ||
                    u.uid.includes(filter))
            );

            if (available.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-500 text-sm py-4">No users found</p>`;
                return;
            }

            available.forEach(user => {
                const div = document.createElement('div');
                div.className = 'contact-item p-3 rounded-xl flex items-center gap-3';
                div.onclick = () => addContact(user.uid);

                div.innerHTML = `
                    <img src="${user.pfp || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name) + '&background=2563eb&color=fff'}" class="w-10 h-10 rounded-full object-cover border border-slate-700 flex-shrink-0" />
                    <div class="flex-1 min-w-0">
                        <p class="font-bold text-sm text-white">${user.name}</p>
                        <p class="text-xs text-slate-400 font-mono">@${user.uid}</p>
                    </div>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-lg text-xs font-bold transition">Add</button>
                `;
                container.appendChild(div);
            });
        }

        // Search in contact picker
        document.getElementById('contact-search')?.addEventListener('input', (e) => {
            renderContactPickerList(e.target.value);
        });

        // ================================================================
        // ADD CONTACT
        // ================================================================
        window.openAddContact = function() {
            closeModal('contact-picker');
            document.getElementById('add-contact-modal').classList.remove('hidden');
            document.getElementById('add-contact-uid').value = '';
        };

        window.addContactByUID = function() {
            const uid = document.getElementById('add-contact-uid').value.trim();
            if (!uid || uid.length !== 6) {
                showToast('Please enter a valid 6-digit UID');
                return;
            }
            addContact(uid);
        };

        function addContact(uid) {
            const myUID = state.currentUser.uid;
            if (uid === myUID) {
                showToast('You cannot add yourself');
                return;
            }

            const allUsers = window._allUsers || [];
            const target = allUsers.find(u => u.uid === uid);
            if (!target) {
                showToast('User not found');
                return;
            }

            const contacts = state.contacts || [];
            if (contacts.find(c => c.uid === uid)) {
                showToast('Already in contacts');
                return;
            }

            const updatedContacts = [...contacts, {
                uid: target.uid,
                name: target.name,
                pfp: target.pfp || '',
                bio: target.bio || ''
            }];

            update(ref(db, 'users/' + myUID), { contacts: updatedContacts })
                .then(() => {
                    state.contacts = updatedContacts;
                    closeModal('add-contact-modal');
                    closeModal('contact-picker');
                    showToast('Contact added successfully!');
                    renderContacts();
                    renderChatList();
                })
                .catch((err) => {
                    showToast('Failed to add contact: ' + err.message);
                });
        }

        // ================================================================
        // CHAT
        // ================================================================
        window.openChat = function(uid) {
            const contact = state.contacts.find(c => c.uid === uid);
            if (!contact) {
                showToast('Contact not found');
                return;
            }
            startChatWithContact(uid);
        };

        function startChatWithContact(uid) {
            const myUID = state.currentUser.uid;
            const threadKey = myUID < uid ? `${myUID}_text_${uid}` : `${uid}_text_${myUID}`;
            state.activeChatUID = uid;
            state.activeThreadKey = threadKey;

            // Show chat window
            document.getElementById('chat-list-view').style.display = 'none';
            document.getElementById('chat-window-view').classList.remove('hidden');

            // Set contact info
            const contact = state.contacts.find(c => c.uid === uid);
            if (contact) {
                document.getElementById('chat-contact-name').textContent = contact.name;
                document.getElementById('chat-contact-avatar').src = contact.pfp ||
                    'https://ui-avatars.com/api/?name=' + encodeURIComponent(contact.name) + '&background=2563eb&color=fff';
                document.getElementById('chat-contact-status').textContent = 'online'; // We'll track this later
            } else {
                // Try to find in all users
                const allUsers = window._allUsers || [];
                const user = allUsers.find(u => u.uid === uid);
                if (user) {
                    document.getElementById('chat-contact-name').textContent = user.name;
                    document.getElementById('chat-contact-avatar').src = user.pfp ||
                        'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name) + '&background=2563eb&color=fff';
                }
            }

            // Load messages
            loadMessages(threadKey);

            // Mark messages as seen
            markMessagesAsSeen(threadKey);

            // Scroll to bottom
            setTimeout(() => {
                const container = document.getElementById('messages-container');
                container.scrollTop = container.scrollHeight;
            }, 100);

            // Listen for new messages in this thread
            listenToMessages(threadKey);
        }

        function listenToMessages(threadKey) {
            const messagesRef = ref(db, 'chats/' + threadKey);
            onChildAdded(messagesRef, (snap) => {
                if (state.activeThreadKey === threadKey) {
                    loadMessages(threadKey);
                }
            });
        }

        function loadMessages(threadKey) {
            const container = document.getElementById('messages-container');
            const messagesRef = ref(db, 'chats/' + threadKey);
            get(messagesRef).then((snap) => {
                const data = snap.val();
                container.innerHTML = '';

                if (!data) {
                    container.innerHTML = `
                        <div class="text-center text-slate-500 text-sm py-12">
                            <p>No messages yet</p>
                            <p class="text-xs mt-1">Say hello!</p>
                        </div>
                    `;
                    return;
                }

                const msgArray = Object.entries(data).map(([id, msg]) => ({ id, ...msg }));
                msgArray.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                msgArray.forEach(msg => {
                    const isSent = msg.sender === state.currentUser.uid;
                    const bubble = document.createElement('div');
                    bubble.className = `max-w-[85%] p-3 rounded-2xl text-sm ${isSent ? 'bubble-sent self-end' : 'bubble-received self-start'}`;

                    let content = '';

                    // Text
                    if (msg.text) {
                        content += `<p class="break-words">${escapeHtml(msg.text)}</p>`;
                    }

                    // Media
                    if (msg.mediaType && msg.mediaUrl) {
                        const mediaHtml = getMediaHtml(msg.mediaType, msg.mediaUrl);
                        content += mediaHtml;
                    }

                    // Time
                    const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                    content += `<span class="text-[10px] opacity-70 block text-right mt-1">${timeStr}</span>`;

                    bubble.innerHTML = content;
                    container.appendChild(bubble);
                });

                // Scroll to bottom
                setTimeout(() => {
                    container.scrollTop = container.scrollHeight;
                }, 50);

                // Mark as seen
                markMessagesAsSeen(threadKey);
            });
        }

        function getMediaHtml(type, url) {
            switch (type) {
                case 'image':
                    return `<div class="media-preview mt-2" onclick="openMediaViewer('${url}', 'image')">
                                <img src="${url}" loading="lazy" />
                                <div class="media-label">📷 Image</div>
                            </div>`;
                case 'video':
                    return `<div class="media-preview mt-2" onclick="openMediaViewer('${url}', 'video')">
                                <video src="${url}" muted playsinline></video>
                                <div class="media-label">🎬 Video</div>
                            </div>`;
                case 'document':
                    return `<div class="media-preview mt-2 p-3 bg-slate-800/50 border border-slate-700 rounded-xl flex items-center gap-3" onclick="openMediaViewer('${url}', 'document')">
                                <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                                </svg>
                                <span class="text-sm text-white">📄 Document</span>
                            </div>`;
                default:
                    return `<div class="media-preview mt-2 p-3 bg-slate-800/50 border border-slate-700 rounded-xl flex items-center gap-3">
                                <span class="text-sm text-white">📎 File attached</span>
                            </div>`;
            }
        }

        function markMessagesAsSeen(threadKey) {
            const myUID = state.currentUser.uid;
            const messagesRef = ref(db, 'chats/' + threadKey);
            get(messagesRef).then((snap) => {
                const data = snap.val();
                if (data) {
                    Object.entries(data).forEach(([id, msg]) => {
                        if (msg.sender !== myUID && !msg.seen) {
                            update(ref(db, `chats/${threadKey}/${id}`), { seen: true });
                        }
                    });
                }
            });
        }

        // ================================================================
        // SEND MESSAGE
        // ================================================================
        window.sendMessage = function() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text && !pendingFiles.length) return;

            const myUID = state.currentUser.uid;
            const threadKey = state.activeThreadKey;
            if (!threadKey) return;

            if (text) {
                const msg = {
                    sender: myUID,
                    text: text,
                    timestamp: Date.now(),
                    seen: false
                };
                push(ref(db, 'chats/' + threadKey), msg);
                input.value = '';
                updateLastMessage(threadKey, text);
            }

            // Send files
            if (pendingFiles.length > 0) {
                pendingFiles.forEach(file => {
                    uploadFile(file, threadKey);
                });
                pendingFiles = [];
            }

            // Clear typing indicator
            clearTypingTimeout();
        };

        let pendingFiles = [];

        document.getElementById('file-input')?.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length > 0) {
                for (let file of files) {
                    pendingFiles.push(file);
                }
                showToast(`${files.length} file(s) ready to send`);
                e.target.value = '';
            }
        });

        async function uploadFile(file, threadKey) {
            const myUID = state.currentUser.uid;
            const fileId = Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            const filePath = `chats/${threadKey}/${fileId}_${file.name}`;
            const fileRef = storageRef(storage, filePath);

            try {
                const snapshot = await uploadBytes(fileRef, file);
                const url = await getDownloadURL(snapshot.ref);

                let mediaType = 'document';
                if (file.type.startsWith('image/')) mediaType = 'image';
                else if (file.type.startsWith('video/')) mediaType = 'video';

                const msg = {
                    sender: myUID,
                    text: file.name,
                    timestamp: Date.now(),
                    seen: false,
                    mediaType: mediaType,
                    mediaUrl: url,
                    mediaName: file.name
                };
                push(ref(db, 'chats/' + threadKey), msg);
                updateLastMessage(threadKey, '📎 ' + file.name);
                showToast('File uploaded successfully');
            } catch (err) {
                showToast('Upload failed: ' + err.message);
            }
        }

        function updateLastMessage(threadKey, text) {
            // Update chat list cache
            const parts = threadKey.split('_text_');
            const otherUID = parts[0] === state.currentUser.uid ? parts[1] : parts[0];
            const chat = state.chats.find(c => c.uid === otherUID);
            if (chat) {
                chat.lastMessage = text;
                chat.lastMessageTime = Date.now();
                renderChatList();
            }
        }

        // ================================================================
        // TYPING INDICATOR
        // ================================================================
        document.getElementById('message-input')?.addEventListener('input', () => {
            if (!state.activeThreadKey) return;
            const myUID = state.currentUser.uid;
            const typingRef = ref(db, `typing/${state.activeThreadKey}/${myUID}`);
            set(typingRef, { isTyping: true, timestamp: Date.now() });
            clearTypingTimeout();
            state.typingTimeout = setTimeout(() => {
                remove(typingRef);
            }, 2000);
        });

        // Listen for typing indicators
        function listenTyping(threadKey) {
            const typingRef = ref(db, `typing/${threadKey}`);
            onValue(typingRef, (snap) => {
                const data = snap.val();
                const container = document.getElementById('typing-indicator');
                if (data) {
                    const others = Object.keys(data).filter(key => key !== state.currentUser.uid);
                    if (others.length > 0 && data[others[0]]?.isTyping) {
                        container.classList.remove('hidden');
                    } else {
                        container.classList.add('hidden');
                    }
                } else {
                    container.classList.add('hidden');
                }
            });
        }

        function clearTypingTimeout() {
            if (state.typingTimeout) {
                clearTimeout(state.typingTimeout);
                state.typingTimeout = null;
            }
        }

        // ================================================================
        // CLOSE CHAT
        // ================================================================
        window.closeChatWindow = function() {
            state.activeChatUID = null;
            state.activeThreadKey = null;
            document.getElementById('chat-window-view').classList.add('hidden');
            document.getElementById('chat-list-view').style.display = 'flex';
            renderChatList();
        };

        // ================================================================
        // MEDIA VIEWER
        // ================================================================
        window.openMediaViewer = function(url, type) {
            const viewer = document.getElementById('media-viewer');
            const img = document.getElementById('media-viewer-img');
            const video = document.getElementById('media-viewer-video');
            const other = document.getElementById('media-viewer-other');

            img.classList.add('hidden');
            video.classList.add('hidden');
            other.classList.add('hidden');
            other.innerHTML = '';

            if (type === 'image') {
                img.src = url;
                img.classList.remove('hidden');
            } else if (type === 'video') {
                video.src = url;
                video.classList.remove('hidden');
                video.play();
            } else {
                other.innerHTML = `
                    <div class="text-center">
                        <svg class="w-16 h-16 mx-auto text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                        </svg>
                        <p class="text-white mt-2">Document attached</p>
                        <a href="${url}" target="_blank" class="text-blue-400 underline mt-2 inline-block">Open in new tab</a>
                    </div>
                `;
                other.classList.remove('hidden');
            }

            viewer.classList.remove('hidden');
        };

            video.src = '';
            viewer.classList.add('hidden');

        // PROFILE EDIT
        // ================================================================
        window.editProfile = function() {

            document.getElementById('edit-profile-bio').value = state.currentUser.bio || '';
            document.getElementById('edit-profile-modal').classList.remove('hidden');

            if (!name) {
                showToast('Name cannot be empty');

            const fileRef = storageRef(storage, `profiles/${state.currentUser.uid}/avatar`);
            try {
                await uploadBytes(fileRef, file);
                const url = await getDownloadURL(fileRef);

                renderContacts();

        // CALL SYSTEM

                showToast('No active chat');
                return;

            const contact = state.contacts.find(c => c.uid === state.activeChatUID);
            if (!contact) {

                return;

            state.callType = type;
            state.isCallActive = true;

        window.toggleCallMute = function() {

                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                        </svg>` :
                `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />

        window.toggleCallVideo = function() {
            state.isVideoOff = !state.isVideoOff;
            document.getElementById('call-video-btn').innerHTML = state.isVideoOff ?
                `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18" />
                        </svg>` :
                `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />

        window.endCall = function() {
            state.isCallActive = false;
            state.callType = null;
            state.isMuted = false;
            state.isVideoOff = false;

            document.getElementById('call-overlay').classList.add('hidden');
            document.getElementById('floating-call').classList.add('hidden');

            if (state.localStream) {
                state.localStream.getTracks().forEach(t => t.stop());
                state.localStream = null;
            }
            if (state.remoteStream) {
                state.remoteStream.getTracks().forEach(t => t.stop());
                state.remoteStream = null;
            }
            if (state.peerConnection) {
                state.peerConnection.close();
                state.peerConnection = null;
            }

            showToast('Call ended');
        };

        window.restoreCall = function() {
            document.getElementById('floating-call').classList.add('hidden');
            document.getElementById('call-overlay').classList.remove('hidden');
        };

        // ================================================================
        // LOGOUT
        // ================================================================
        window.logoutUser = function() {
            if (confirm('Are you sure you want to logout?')) {
                signOut(auth).then(() => {
                    state.currentUser = null;
                    state.contacts = [];
                    state.chats = [];
                    state.messages = {};
                    renderChatList();
                    renderContacts();
                    document.getElementById('chat-list-view').style.display = 'flex';
                    document.getElementById('chat-window-view').classList.add('hidden');
                    document.getElementById('profile-view').classList.add('hidden');
                    // Show login
                    showLoginScreen();
                });
            }
        };

        // ================================================================
        // UTILITY FUNCTIONS
        // ================================================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('hidden');
            if (window.toastTimeout) clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ================================================================
        // KEYBOARD SHORTCUTS
        // ================================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                const input = document.getElementById('message-input');
                if (document.activeElement === input) {
                    e.preventDefault();
                    sendMessage();
                }
            }
        });

        // ================================================================
        // INIT
        // ================================================================
        console.log('🚀 StarChat - Complete Chat Application');
        console.log('✅ WhatsApp-like UI');
        console.log('✅ Chat list with unread badges');
        console.log('✅ Contact management');
        console.log('✅ File sharing (images, videos, documents)');
        console.log('✅ Audio & Video calling (simulated)');
        console.log('✅ Profile management with picture upload');
        console.log('✅ Typing indicators');
        console.log('✅ Dark/Light theme');
        console.log('✅ Real-time messaging with Firebase');
    </script>
</body>
</html>
