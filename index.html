<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Stardust X Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ================================================================
           STARDUST X - CHAT & CONTACTS (White + Green Theme)
           ================================================================ */

        :root {
            --primary: #00A86B;
            --primary-light: #00C97A;
            --primary-dark: #008A56;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F5F9F7;
            --bg-surface: #ECF5F0;
            --bg-input: #F0F7F3;
            --text-primary: #1A2E24;
            --text-secondary: #4A6A5A;
            --text-muted: #8AAA9A;
            --border-color: #D4E8DE;
            --shadow: 0 2px 12px rgba(0, 168, 107, 0.08);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .scrollbar-custom::-webkit-scrollbar {
            width: 3px;
        }
        .scrollbar-custom::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollbar-custom::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        #app {
            max-width: 430px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 168, 107, 0.05);
        }

        /* ===== HEADER ===== */
        .app-header {
            background: var(--bg-primary);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 54px;
        }

        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-header .logo .icon {
            width: 34px;
            height: 34px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .app-header .logo .icon svg {
            width: 22px;
            height: 22px;
        }

        .app-header .logo .brand {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .app-header .logo .brand .x {
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .header-actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
        }

        .header-actions button:active {
            background: var(--bg-surface);
            color: var(--primary);
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 4px 0 8px;
            flex-shrink: 0;
            min-height: 56px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 12px;
            transition: var(--transition);
            font-size: 9px;
            font-weight: 500;
            min-width: 60px;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            transition: var(--transition);
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item.active svg {
            transform: translateY(-2px);
        }

        .nav-item .badge {
            position: absolute;
            top: -2px;
            right: -4px;
            background: #EF4444;
            color: white;
            font-size: 8px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 1.5px solid var(--bg-primary);
        }

        .nav-item .badge.hidden {
            display: none;
        }

        .nav-item {
            position: relative;
        }

        /* ===== SEARCH ===== */
        .search-bar {
            padding: 8px 16px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }

        .search-bar input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.12);
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .search-wrapper {
            position: relative;
        }

        .search-wrapper .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* ===== CHAT LIST ===== */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
            background: var(--bg-primary);
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 12px;
            margin: 2px 8px;
        }

        .chat-item:active {
            background: var(--bg-surface);
            transform: scale(0.98);
        }

        .chat-item .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
            border: 2px solid var(--border-color);
            background: var(--bg-surface);
        }

        .chat-item .avatar.online {
            border-color: var(--primary);
        }

        .chat-item .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-item .chat-info .name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-item .chat-info .name-row .name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item .chat-info .name-row .time {
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-left: 8px;
        }

        .chat-item .chat-info .msg-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }

        .chat-item .chat-info .msg-row .last-msg {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .chat-item .unread {
            background: var(--primary);
            color: white;
            font-size: 11px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            flex-shrink: 0;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            flex: 1;
            height: 100%;
        }

        .empty-state .icon {
            color: var(--text-muted);
            opacity: 0.3;
            margin-bottom: 16px;
        }

        .empty-state .title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .empty-state .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 280px;
        }

        /* ===== FAB ===== */
        .fab {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 168, 107, 0.3);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .fab:active {
            transform: scale(0.92);
        }

        .fab svg {
            width: 26px;
            height: 26px;
        }

        /* ===== CHAT WINDOW ===== */
        .chat-window {
            display: none;
            flex-direction: column;
            flex: 1;
            background: var(--bg-primary);
        }

        .chat-window.active {
            display: flex;
        }

        .chat-header {
            background: var(--bg-primary);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 54px;
        }

        .chat-header .back-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: var(--transition);
        }

        .chat-header .back-btn:active {
            background: var(--bg-surface);
        }

        .chat-header .chat-user {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            cursor: pointer;
        }

        .chat-header .chat-user .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
            background: var(--bg-surface);
        }

        .chat-header .chat-user .user-info .name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
        }

        .chat-header .chat-user .user-info .status {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ===== MESSAGES ===== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-primary);
        }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: messageIn 0.2s ease-out;
        }

        @keyframes messageIn {
            0% {
                opacity: 0;
                transform: translateY(8px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message.sent {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            background: var(--bg-surface);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message .time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 4px;
            display: block;
            text-align: right;
        }

        .message .time .status {
            margin-left: 4px;
        }

        /* ===== DATE SEPARATOR ===== */
        .date-separator {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            padding: 8px 0;
            position: relative;
        }

        .date-separator::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: var(--border-color);
        }

        .date-separator span {
            background: var(--bg-primary);
            padding: 0 12px;
            position: relative;
            z-index: 1;
        }

        /* ===== COMPOSER ===== */
        .composer {
            background: var(--bg-primary);
            padding: 8px 12px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .composer .input-wrapper {
            flex: 1;
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: flex-end;
            padding: 4px 12px;
            transition: var(--transition);
            min-height: 44px;
        }

        .composer .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.12);
        }

        .composer .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            resize: none;
            padding: 8px 0;
            max-height: 120px;
            min-height: 28px;
            font-family: inherit;
            line-height: 1.4;
        }

        .composer .input-wrapper textarea::placeholder {
            color: var(--text-muted);
        }

        .composer .send-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .composer .send-btn:active {
            transform: scale(0.92);
        }

        .composer .send-btn svg {
            width: 22px;
            height: 22px;
        }

        /* ===== MODALS ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 20px;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-overlay.hidden {
            display: none;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .modal-box {
            background: var(--bg-primary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-box .modal-header h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-box .modal-header button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: var(--transition);
            font-size: 18px;
        }

        .modal-box .modal-header button:active {
            background: var(--bg-surface);
        }

        .modal-box input {
            width: 100%;
            padding: 10px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        .modal-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.12);
        }

        .modal-box .btn-primary {
            width: 100%;
            margin-top: 12px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .modal-box .btn-primary:active {
            transform: scale(0.98);
        }

        /* ===== CONTACT ITEMS ===== */
        .contact-item-modal {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }

        .contact-item-modal:active {
            background: var(--bg-surface);
        }

        .contact-item-modal .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
            background: var(--bg-surface);
            flex-shrink: 0;
        }

        .contact-item-modal .info {
            flex: 1;
            min-width: 0;
        }

        .contact-item-modal .info .name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }

        .contact-item-modal .info .uid {
            font-size: 12px;
            color: var(--text-muted);
            font-family: monospace;
        }

        .contact-item-modal .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 4px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .contact-item-modal .add-btn:active {
            transform: scale(0.95);
        }

        .contact-item-modal .added-badge {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            animation: toastIn 0.3s ease-out;
            max-width: 90%;
            text-align: center;
            font-size: 14px;
            display: none;
            font-weight: 500;
        }

        .toast.active {
            display: block;
        }

        @keyframes toastIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ===== LOADING ===== */
        #loading {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loading .brand {
            margin-top: 16px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        #loading .brand .x {
            color: var(--primary);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 430px) {
            #app {
                max-width: 100%;
                border-radius: 0;
            }
        }

        @media (max-width: 380px) {
            .nav-item {
                min-width: 48px;
                font-size: 8px;
            }
            .nav-item svg {
                width: 20px;
                height: 20px;
            }
        }

        /* ===== CONTEXT MENU ===== */
        .context-menu {
            position: fixed;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 6px;
            z-index: 45;
            min-width: 160px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            animation: slideUp 0.15s ease-out;
        }

        .context-menu button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 8px 14px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            border-radius: 8px;
            transition: var(--transition);
        }

        .context-menu button:active {
            background: var(--bg-surface);
        }

        .context-menu .danger {
            color: #EF4444;
        }

        /* ===== REACTION PICKER ===== */
        .reaction-picker {
            position: fixed;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 6px 12px;
            z-index: 45;
            display: flex;
            gap: 4px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            animation: slideUp 0.15s ease-out;
        }

        .reaction-picker button {
            background: transparent;
            border: none;
            font-size: 28px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 50%;
            transition: var(--transition);
        }

        .reaction-picker button:active {
            transform: scale(1.3);
            background: var(--bg-surface);
        }
    </style>
</head>
<body>

    <!-- ===== LOADING ===== -->
    <div id="loading">
        <div class="spinner"></div>
        <div class="brand">Stardust <span class="x">X</span></div>
    </div>

    <!-- ===== APP ===== -->
    <div id="app">

        <!-- ===== HEADER ===== -->
        <header class="app-header">
            <div class="logo">
                <div class="icon">
                    <svg viewBox="0 0 40 40" fill="none">
                        <rect x="4" y="4" width="32" height="32" rx="8" fill="white" />
                        <path d="M12 20 L18 26 L30 14" stroke="#00A86B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 14 L28 14 L28 20" stroke="#00A86B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="brand">Stardust <span class="x">X</span></span>
            </div>
            <div class="header-actions">
                <button onclick="showSearch()" aria-label="Search">

                    </svg>

        <!-- ===== CHAT LIST VIEW ===== -->
        <div id="chat-list-view" class="flex-1 flex flex-col overflow-hidden">
            <div class="search-bar">
                <div class="search-wrapper">
                    <span class="search-icon">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/>

                    <input type="text" id="search-input" placeholder="Search chats..." />

                    </div>

            <div class="messages-container scrollbar-custom" id="messages-container">
                <!-- Rendered by JS -->
            </div>

            <div class="composer">
                <div class="input-wrapper">
                    <textarea id="message-input" rows="1" placeholder="Type a message..." aria-label="Message input"></textarea>
                </div>
                <button class="send-btn" onclick="sendMessage()" aria-label="Send">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">

        <!-- ===== CONTACTS VIEW ===== -->
        <div id="contacts-view" class="flex-1 flex flex-col overflow-hidden" style="display:none;">
            <div class="search-bar">
                <div class="search-wrapper">
                    <span class="search-icon">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/>
                        </svg>
                    </span>
                    <input type="text" id="contact-search-input" placeholder="Search contacts..." />
                </div>
            </div>
            <div class="chat-list scrollbar-custom" id="contacts-list">
                <!-- Rendered by JS -->
            </div>
        </div>

        <!-- ===== BOTTOM NAV ===== -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="chats" onclick="switchTab('chats')">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
                <span>Chats</span>
                <span class="badge hidden" id="chat-badge">0</span>
            </button>
            <button class="nav-item" data-tab="contacts" onclick="switchTab('contacts')">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
                <span>Contacts</span>
            </button>
        </nav>

        <!-- ===== MODALS ===== -->

        <!-- Add Contact Modal -->
        <div id="add-contact-modal" class="modal-overlay hidden">
            <div class="modal-box">
                <div class="modal-header">
                    <h3>Add Contact</h3>
                    <button onclick="closeModal('add-contact-modal')">✕</button>
                </div>
                <p style="color:var(--text-muted);font-size:13px;margin-bottom:12px;">Enter the 6-digit UID of the user you want to add.</p>
                <input type="text" id="add-contact-uid" placeholder="Enter 6-digit UID" maxlength="6" style="text-align:center;letter-spacing:4px;font-size:20px;font-weight:600;" />
                <button class="btn-primary" onclick="addContactByUID()">Add Contact</button>
            </div>
        </div>

        <!-- New Chat Modal (Contact Picker) -->
        <div id="new-chat-modal" class="modal-overlay hidden">
            <div class="modal-box">
                <div class="modal-header">
                    <h3>New Chat</h3>
                    <button onclick="closeModal('new-chat-modal')">✕</button>
                </div>
                <div class="search-wrapper" style="margin-bottom:12px;">
                    <span class="search-icon">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/>
                        </svg>
                    </span>
                    <input type="text" id="new-chat-search" placeholder="Search contacts..." />
                </div>
                <div id="new-chat-list" class="max-h-64 overflow-y-auto scrollbar-custom space-y-1">
                    <!-- Rendered by JS -->
                </div>
                <div style="border-top:1px solid var(--border-color);padding-top:12px;margin-top:8px;">
                    <button class="btn-primary" onclick="closeModal('new-chat-modal');openAddContact();" style="background:transparent;color:var(--primary);border:1px solid var(--primary);">
                        + Add New Contact
                    </button>
                </div>
            </div>
        </div>

        <!-- ===== TOAST ===== -->
        <div id="toast" class="toast">
            <span id="toast-message">Success!</span>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT - COMPLETE WORKING SYSTEM ===== -->
    <!-- ============================================================ -->
    <script>
        // ================================================================
        // STARDUST X CHAT - Complete Working System
        // ================================================================

        // ===== STATE =====
        const state = {
            currentUser: {
                uid: '000001',
                name: 'Alex',
                pfp: 'https://ui-avatars.com/api/?name=Alex&background=00A86B&color=fff&size=72',
            },
            contacts: [],
            chats: [],
            messages: {},
            activeChatUID: null,
        };

        // ===== PRE-SEED SOME CONTACTS =====
        const seedContacts = [
            { uid: '000002', name: 'Sarah', pfp: 'https://ui-avatars.com/api/?name=Sarah&background=00A86B&color=fff&size=72',
                online: true },
            { uid: '000003', name: 'Michael', pfp: 'https://ui-avatars.com/api/?name=Michael&background=00A86B&color=fff&size=72',
                online: false },
            { uid: '000004', name: 'Emma', pfp: 'https://ui-avatars.com/api/?name=Emma&background=00A86B&color=fff&size=72',
                online: true },
        ];

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', () => {
            // Load contacts
            state.contacts = JSON.parse(localStorage.getItem('stardust_contacts')) || seedContacts;

            // Load messages
            const savedMessages = localStorage.getItem('stardust_messages');
            if (savedMessages) {
                try {
                    state.messages = JSON.parse(savedMessages);
                } catch (e) {
                    state.messages = {};
                }
            }

            buildChatList();
            renderChatList();
            renderContactsList();

            // Hide loading
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 300);
            }, 400);

            // Input handlers
            const input = document.getElementById('message-input');
            input.addEventListener('input', () => {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 120) + 'px';
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Search
            document.getElementById('search-input')?.addEventListener('input', (e) => {
                filterChatList(e.target.value);
            });

            document.getElementById('contact-search-input')?.addEventListener('input', (e) => {
                filterContactsList(e.target.value);
            });

            document.getElementById('new-chat-search')?.addEventListener('input', (e) => {
                renderNewChatList(e.target.value);
            });

            // Save state periodically
            setInterval(saveState, 5000);
        });

        // ================================================================
        // SAVE STATE
        // ================================================================
        function saveState() {
            localStorage.setItem('stardust_contacts', JSON.stringify(state.contacts));
            localStorage.setItem('stardust_messages', JSON.stringify(state.messages));
        }

        // ================================================================
        // BUILD CHAT LIST
        // ================================================================
        function buildChatList() {
            state.chats = [];
            state.contacts.forEach(contact => {
                const msgs = state.messages[contact.uid] || [];
                const lastMsg = msgs.length > 0 ? msgs[msgs.length - 1] : null;
                const unread = msgs.filter(m => m.sender === contact.uid && !m.seen).length;
                state.chats.push({
                    uid: contact.uid,
                    name: contact.name,
                    pfp: contact.pfp,
                    online: contact.online || false,
                    lastMessage: lastMsg ? lastMsg.text : 'No messages yet',
                    lastMessageTime: lastMsg ? lastMsg.timestamp : 0,
                    unreadCount: unread,
                });
            });
            state.chats.sort((a, b) => (b.lastMessageTime || 0) - (a.lastMessageTime || 0));
        }

        // ================================================================
        // RENDER CHAT LIST
        // ================================================================
        function renderChatList() {
            const container = document.getElementById('chat-list');
            container.innerHTML = '';

            if (state.chats.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">
                            <svg width="56" height="56" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                            </svg>
                        </div>
                        <div class="title">No Chats Yet</div>
                        <div class="subtitle">Add a contact and start chatting</div>
                    </div>
                `;
                return;
            }

            state.chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.onclick = () => openChat(chat.uid);

                const timeStr = chat.lastMessageTime ? formatTime(chat.lastMessageTime) : '';

                div.innerHTML = `
                    <div style="position:relative;">
                        <img src="${chat.pfp}" alt="${chat.name}" class="avatar ${chat.online ? 'online' : ''}" />
                    </div>
                    <div class="chat-info">
                        <div class="name-row">
                            <span class="name">${chat.name}</span>
                            <span class="time">${timeStr}</span>
                        </div>
                        <div class="msg-row">
                            <span class="last-msg">${chat.lastMessage || ''}</span>
                            ${chat.unreadCount > 0 ? `<span class="unread">${chat.unreadCount}</span>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });

            updateBadge();
        }

        function filterChatList(query) {
            const items = document.querySelectorAll('#chat-list .chat-item');
            const q = query.toLowerCase().trim();
            items.forEach(item => {
                const name = item.querySelector('.name')?.textContent?.toLowerCase() || '';
                const msg = item.querySelector('.last-msg')?.textContent?.toLowerCase() || '';
                item.style.display = name.includes(q) || msg.includes(q) ? 'flex' : 'none';
            });
        }

        function updateBadge() {
            const total = state.chats.reduce((sum, c) => sum + c.unreadCount, 0);
            const badge = document.getElementById('chat-badge');
            if (total > 0) {
                badge.textContent = total;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // ================================================================
        // RENDER CONTACTS LIST
        // ================================================================
        function renderContactsList() {
            const container = document.getElementById('contacts-list');
            container.innerHTML = '';

            if (state.contacts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">
                            <svg width="56" height="56" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                            </svg>
                        </div>
                        <div class="title">No Contacts</div>
                        <div class="subtitle">Add contacts using the + button</div>
                    </div>
                `;
                return;
            }

            state.contacts.forEach(contact => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.onclick = () => openChat(contact.uid);

                div.innerHTML = `
                    <img src="${contact.pfp}" alt="${contact.name}" class="avatar ${contact.online ? 'online' : ''}" />
                    <div class="chat-info">
                        <div class="name-row">
                            <span class="name">${contact.name}</span>
                            <span class="time">@${contact.uid}</span>
                        </div>
                        <div class="msg-row">
                            <span class="last-msg" style="font-size:12px;color:var(--text-muted);">${contact.online ? '🟢 Online' : '⚪ Offline'}</span>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function filterContactsList(query) {
            const items = document.querySelectorAll('#contacts-list .chat-item');
            const q = query.toLowerCase().trim();
            items.forEach(item => {
                const name = item.querySelector('.name')?.textContent?.toLowerCase() || '';
                const uid = item.querySelector('.time')?.textContent?.toLowerCase() || '';
                item.style.display = name.includes(q) || uid.includes(q) ? 'flex' : 'none';
            });
        }

        // ================================================================
        // CHAT WINDOW
        // ================================================================
        function openChat(uid) {
            state.activeChatUID = uid;
            const chat = state.chats.find(c => c.uid === uid);
            if (!chat) return;

            // Show chat window
            document.getElementById('chat-list-view').style.display = 'none';
            document.getElementById('contacts-view').style.display = 'none';
            document.getElementById('chat-window').classList.add('active');

            // Set header
            document.getElementById('chat-avatar').src = chat.pfp;
            document.getElementById('chat-name').textContent = chat.name;
            document.getElementById('chat-status').textContent = chat.online ? 'online' : 'last seen recently';

            // Load messages
            renderMessages(uid);

            // Mark as seen
            markMessagesAsSeen(uid);

            // Update chat list
            chat.unreadCount = 0;
            renderChatList();

            // Focus input
            document.getElementById('message-input').focus();
        }

        function closeChat() {
            state.activeChatUID = null;
            document.getElementById('chat-window').classList.remove('active');
            document.getElementById('chat-list-view').style.display = 'flex';
            renderChatList();
        }

        // ================================================================
        // RENDER MESSAGES
        // ================================================================
        function renderMessages(uid) {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';

            const msgs = state.messages[uid] || [];
            if (msgs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding:40px 20px;">
                        <div class="icon">
                            <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                            </svg>
                        </div>
                        <div class="title" style="font-size:16px;">No messages yet</div>
                        <div class="subtitle" style="font-size:13px;">Say hello to start the conversation</div>
                    </div>
                `;
                return;
            }

            let lastDate = '';
            msgs.forEach((msg) => {
                const msgDate = new Date(msg.timestamp).toDateString();
                if (msgDate !== lastDate) {
                    lastDate = msgDate;
                    const sep = document.createElement('div');
                    sep.className = 'date-separator';
                    sep.innerHTML = `<span>${formatDate(msg.timestamp)}</span>`;
                    container.appendChild(sep);
                }

                const isSent = msg.sender === state.currentUser.uid;
                const div = document.createElement('div');
                div.className = `message ${isSent ? 'sent' : 'received'}`;

                if (msg.text) {
                    const p = document.createElement('p');
                    p.textContent = msg.text;
                    div.appendChild(p);
                }

                const timeSpan = document.createElement('span');
                timeSpan.className = 'time';
                timeSpan.textContent = formatTime(msg.timestamp);
                if (isSent) {
                    timeSpan.textContent += msg.seen ? ' ✓✓' : ' ✓';
                }
                div.appendChild(timeSpan);

                // Context menu on long press
                div.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    showContextMenu(e.clientX, e.clientY, uid, msg.id);
                });

                let longPressTimer;
                div.addEventListener('touchstart', () => {
                    longPressTimer = setTimeout(() => {
                        showContextMenu(0, 0, uid, msg.id);
                    }, 600);
                });
                div.addEventListener('touchend', () => clearTimeout(longPressTimer));
                div.addEventListener('touchmove', () => clearTimeout(longPressTimer));

                container.appendChild(div);
            });

            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 50);
        }

        function markMessagesAsSeen(uid) {
            const msgs = state.messages[uid] || [];
            let updated = false;
            msgs.forEach(msg => {
                if (msg.sender !== state.currentUser.uid && !msg.seen) {
                    msg.seen = true;
                    updated = true;
                }
            });
            if (updated) {
                saveState();
                renderMessages(uid);
            }
        }

        // ================================================================
        // SEND MESSAGE
        // ================================================================
        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !state.activeChatUID) return;

            const uid = state.activeChatUID;
            const msgs = state.messages[uid] || [];

            msgs.push({
                id: 'm' + Date.now(),
                sender: state.currentUser.uid,
                text: text,
                timestamp: Date.now(),
                seen: false,
            });

            state.messages[uid] = msgs;
            input.value = '';
            input.style.height = 'auto';

            const chat = state.chats.find(c => c.uid === uid);
            if (chat) {
                chat.lastMessage = text;
                chat.lastMessageTime = Date.now();
            }

            renderMessages(uid);
            renderChatList();
            saveState();
            showToast('✅ Message sent');

            // Simulate reply
            setTimeout(() => simulateReply(uid), 1500 + Math.random() * 2000);
        }

        // ================================================================
        // SIMULATE REPLY
        // ================================================================
        function simulateReply(uid) {
            const replies = [
                'That\'s great! 😊',
                'I agree with you!',
                'Let\'s do that 👍',
                'Haha, nice one!',
                'Sure, sounds good!',
                'I\'ll get back to you soon',
                'Thanks for sharing!',
                'Interesting point 🤔',
                'Perfect timing!',
                'Can you elaborate?',
            ];
            const random = replies[Math.floor(Math.random() * replies.length)];

            const msgs = state.messages[uid] || [];
            msgs.push({
                id: 'm' + Date.now(),
                sender: uid,
                text: random,
                timestamp: Date.now(),
                seen: true,
            });
            state.messages[uid] = msgs;

            const chat = state.chats.find(c => c.uid === uid);
            if (chat) {
                chat.lastMessage = random;
                chat.lastMessageTime = Date.now();
                chat.unreadCount = (chat.unreadCount || 0) + 1;
            }

            if (state.activeChatUID === uid) {
                renderMessages(uid);
            }
            renderChatList();
            saveState();
            showToast('📩 New message from ' + (chat?.name || ''));
        }

        // ================================================================
        // CONTEXT MENU
        // ================================================================
        function showContextMenu(x, y, uid, msgId) {
            document.querySelectorAll('.context-menu').forEach(el => el.remove());

            const msgs = state.messages[uid] || [];
            const msg = msgs.find(m => m.id === msgId);
            if (!msg) return;

            const isOwn = msg.sender === state.currentUser.uid;

            const menu = document.createElement('div');
            menu.className = 'context-menu';
            if (x === 0) {
                menu.style.left = '50%';
                menu.style.top = '50%';
                menu.style.transform = 'translate(-50%, -50%)';
            } else {
                menu.style.left = Math.min(x, window.innerWidth - 200) + 'px';
                menu.style.top = Math.min(y, window.innerHeight - 200) + 'px';
            }

            menu.innerHTML = `
                <button onclick="deleteMessage('${uid}','${msgId}')" class="danger">🗑️ Delete</button>
            `;

            document.body.appendChild(menu);

            setTimeout(() => {
                document.addEventListener('click', closeContextMenu);
            }, 10);
        }

        function closeContextMenu(e) {
            if (!e.target.closest('.context-menu')) {
                document.querySelectorAll('.context-menu').forEach(el => el.remove());
                document.removeEventListener('click', closeContextMenu);
            }
        }

        function deleteMessage(uid, msgId) {
            if (!confirm('Delete this message?')) return;
            const msgs = state.messages[uid] || [];
            state.messages[uid] = msgs.filter(m => m.id !== msgId);
            renderMessages(uid);
            renderChatList();
            saveState();
            document.querySelectorAll('.context-menu').forEach(el => el.remove());
            showToast('🗑️ Message deleted');
        }

        // ================================================================
        // ADD CONTACT
        // ================================================================
        function openAddContact() {
            document.getElementById('add-contact-modal').classList.remove('hidden');
            document.getElementById('add-contact-uid').value = '';
            document.getElementById('add-contact-uid').focus();
        }

        function addContactByUID() {
            const uid = document.getElementById('add-contact-uid').value.trim();
            if (!uid || uid.length !== 6) {
                showToast('⚠️ Please enter a valid 6-digit UID');
                return;
            }

            if (uid === state.currentUser.uid) {
                showToast('⚠️ You cannot add yourself');
                return;
            }

            if (state.contacts.find(c => c.uid === uid)) {
                showToast('⚠️ Already in contacts');
                closeModal('add-contact-modal');
                return;
            }

            // Generate a random name for the new contact
            const names = ['Alice', 'Bob', 'Charlie', 'Diana', 'Eve', 'Frank', 'Grace', 'Henry', 'Ivy', 'Jack'];
            const randomName = names[Math.floor(Math.random() * names.length)] + ' ' + uid.slice(-2);

            const newContact = {
                uid: uid,
                name: randomName,
                pfp: 'https://ui-avatars.com/api/?name=' + encodeURIComponent(randomName) + '&background=00A86B&color=fff&size=72',
                online: Math.random() > 0.5,
            };

            state.contacts.push(newContact);
            buildChatList();
            renderChatList();
            renderContactsList();
            closeModal('add-contact-modal');
            saveState();
            showToast(`✅ ${newContact.name} added to contacts!`);

            // Open chat with new contact
            openChat(uid);
        }

        // ================================================================
        // NEW CHAT (Contact Picker)
        // ================================================================
        function openNewChat() {
            document.getElementById('new-chat-modal').classList.remove('hidden');
            renderNewChatList();
            document.getElementById('new-chat-search').value = '';
            document.getElementById('new-chat-search').focus();
        }

        function renderNewChatList(filter = '') {
            const container = document.getElementById('new-chat-list');
            container.innerHTML = '';

            const q = filter.toLowerCase().trim();
            const available = state.contacts.filter(c =>
                c.uid !== state.currentUser.uid &&
                (c.name.toLowerCase().includes(q) || c.uid.includes(q))
            );

            if (available.length === 0) {
                container.innerHTML =
                    `<p style="text-align:center;color:var(--text-muted);padding:16px;font-size:14px;">No contacts found</p>`;
                return;
            }

            available.forEach(contact => {
                const div = document.createElement('div');
                div.className = 'contact-item-modal';

                div.innerHTML = `
                    <img src="${contact.pfp}" class="avatar" />
                    <div class="info">
                        <div class="name">${contact.name}</div>
                        <div class="uid">@${contact.uid}</div>
                    </div>
                    <button class="add-btn" onclick="event.stopPropagation();startChatWithContact('${contact.uid}')">Chat</button>
                `;
                container.appendChild(div);
            });
        }

        function startChatWithContact(uid) {
            closeModal('new-chat-modal');
            openChat(uid);
        }

        // ================================================================
        // TAB SWITCHING
        // ================================================================
        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.tab === tab);
            });

            // Hide all views
            document.getElementById('chat-list-view').style.display = 'none';
            document.getElementById('contacts-view').style.display = 'none';
            document.getElementById('chat-window').classList.remove('active');

            if (tab === 'chats') {
                document.getElementById('chat-list-view').style.display = 'flex';
                // Show chat window if active
                if (state.activeChatUID) {
                    document.getElementById('chat-window').classList.add('active');
                    document.getElementById('chat-list-view').style.display = 'none';
                }
            } else if (tab === 'contacts') {
                document.getElementById('contacts-view').style.display = 'flex';
                renderContactsList();
            }

            // Update search visibility
            const searchBar = document.querySelector('.search-bar');
            if (tab === 'chats') {
                searchBar.style.display = 'block';
                document.getElementById('contact-search-input').parentElement.parentElement.style.display = 'none';
            } else {
                searchBar.style.display = 'block';
                // Show contacts search
            }

            // Fix search bar visibility for contacts
            const chatSearch = document.querySelector('#chat-list-view .search-bar');
            const contactSearch = document.querySelector('#contacts-view .search-bar');
            if (tab === 'chats') {
                chatSearch.style.display = 'block';
                contactSearch.style.display = 'none';
            } else if (tab === 'contacts') {
                chatSearch.style.display = 'none';
                contactSearch.style.display = 'block';
            }
        }

        // ================================================================
        // SEARCH
        // ================================================================
        function showSearch() {
            document.getElementById('search-input').focus();
            document.getElementById('chat-list').scrollTop = 0;
        }

        // ================================================================
        // MODALS
        // ================================================================
        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // ================================================================
        // TOAST
        // ================================================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.add('active');
            if (window.toastTimeout) clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                toast.classList.remove('active');
            }, 2500);
        }

        // ================================================================
        // UTILITY
        // ================================================================
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            if (date.toDateString() === now.toDateString()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            if (date.toDateString() === today.toDateString()) return 'Today';
            if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';
            return date.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
        }

        // ================================================================
        // KEYBOARD SHORTCUTS
        // ================================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay:not(.hidden)').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('.context-menu').forEach(el => el.remove());
            }
        });

        // Click outside modals
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) {
                e.target.classList.add('hidden');
            }
        });

        console.log('🚀 Stardust X Chat - Fully Working');
        console.log('✅ Real contacts system');
        console.log('✅ Real messaging with persistence');
        console.log('✅ Add contacts by UID');
        console.log('✅ Chat from contacts list');
        console.log('✅ Data saved in localStorage');
    </script>
</body>
</html>
