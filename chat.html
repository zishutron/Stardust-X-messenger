<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Chats - Stardust X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        /* ================================================================
           CHAT PAGE STYLES - With Dark Mode Support
           ================================================================ */
        :root {
            --primary: #00A86B;
            --primary-light: #00C97A;
            --primary-dark: #008A56;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F5F9F7;
            --bg-surface: #ECF5F0;
            --bg-input: #F0F7F3;
            --text-primary: #1A2E24;
            --text-secondary: #4A6A5A;
            --text-muted: #8AAA9A;
            --border-color: #D4E8DE;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.25s ease;
            --danger: #EF4444;
            --warning: #F59E0B;
        }

        .dark-mode {
            --bg-primary: #1A1A2E;
            --bg-secondary: #0F0F1A;
            --bg-surface: #2A2A44;
            --bg-input: #22223A;
            --text-primary: #F0F0F5;
            --text-secondary: #B0B0C8;
            --text-muted: #7A7A94;
            --border-color: #33334A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .scrollbar-custom::-webkit-scrollbar { width: 3px; }
        .scrollbar-custom::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-custom::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        #app {
            max-width: 430px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 168, 107, 0.05);
        }

        .app-header {
            background: var(--bg-primary);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 54px;
        }
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .app-header .logo .icon {
            width: 34px;
            height: 34px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .app-header .logo .icon svg { width: 22px; height: 22px; }
        .app-header .logo .brand {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .app-header .logo .brand .x { color: var(--primary); }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .header-actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-actions button:active {
            background: var(--bg-surface);
            color: var(--primary);
        }

        .bottom-nav {
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 4px 0 8px;
            flex-shrink: 0;
            min-height: 56px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 12px;
            transition: var(--transition);
            font-size: 9px;
            font-weight: 500;
            min-width: 50px;
            position: relative;
        }
        .nav-item svg { width: 24px; height: 24px; transition: var(--transition); }
        .nav-item.active { color: var(--primary); }
        .nav-item.active svg { transform: translateY(-2px); }
        .nav-item .badge {
            position: absolute;
            top: -2px;
            right: -4px;
            background: var(--danger);
            color: white;
            font-size: 8px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 1.5px solid var(--bg-primary);
        }
        .nav-item .badge.hidden { display: none; }

        .search-bar {
            padding: 8px 16px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }
        .search-bar input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.12);
        }
        .search-bar input::placeholder { color: var(--text-muted); }
        .search-wrapper { position: relative; }
        .search-wrapper .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
            background: var(--bg-primary);
        }

        /* ===== CHAT LIST ITEM - WhatsApp Style ===== */
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 12px;
            margin: 2px 8px;
            position: relative;
        }
        .chat-item:active { background: var(--bg-surface); transform: scale(0.98); }
        .chat-item .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
            border: 2px solid var(--border-color);
            background: var(--bg-surface);
            position: relative;
        }
        .chat-item .avatar.online { border-color: var(--primary); }
        .chat-item .avatar .status-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--bg-primary);
        }
        .chat-item .avatar .status-dot.online { background: var(--primary); }
        .chat-item .avatar .status-dot.offline { background: var(--text-muted); }

        .chat-item .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-item .chat-info .name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-item .chat-info .name-row .name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-item .chat-info .name-row .time {
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-left: 8px;
        }
        .chat-item .chat-info .msg-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }
        .chat-item .chat-info .msg-row .last-msg {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .chat-item .chat-info .msg-row .last-msg.unread {
            color: var(--text-primary);
            font-weight: 500;
        }
        .chat-item .unread {
            background: var(--primary);
            color: white;
            font-size: 11px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            flex-shrink: 0;
        }
        .chat-item .item-menu-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 4px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .chat-item .item-menu-btn:active {
            background: var(--bg-surface);
            color: var(--primary);
        }

        /* ===== CHAT ITEM CONTEXT MENU ===== */
        .chat-context-menu {
            position: fixed;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 6px;
            z-index: 45;
            min-width: 180px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.15s ease-out;
        }
        .chat-context-menu button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 8px 14px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            border-radius: 8px;
            transition: var(--transition);
        }
        .chat-context-menu button:active { background: var(--bg-surface); }
        .chat-context-menu .danger { color: var(--danger); }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            flex: 1;
            height: 100%;
        }
        .empty-state .icon { color: var(--text-muted); opacity: 0.3; margin-bottom: 16px; }
        .empty-state .title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .empty-state .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 280px;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            animation: toastIn 0.3s ease-out;
            max-width: 90%;
            text-align: center;
            font-size: 14px;
            display: none;
            font-weight: 500;
        }
        .toast.active { display: block; }
        @keyframes toastIn {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        #loading {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading .brand {
            margin-top: 16px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        #loading .brand .x { color: var(--primary); }

        .menu-dropdown {
            position: absolute;
            top: 54px;
            right: 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 6px;
            min-width: 200px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            z-index: 30;
            display: none;
            animation: slideUp 0.2s ease-out;
        }
        .menu-dropdown.active { display: block; }
        .menu-dropdown .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            color: var(--text-primary);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .menu-dropdown .menu-item:active { background: var(--bg-surface); }
        .menu-dropdown .menu-item .icon {
            color: var(--text-secondary);
            width: 20px;
            text-align: center;
        }
        .menu-dropdown .divider {
            height: 1px;
            background: var(--border-color);
            margin: 4px 8px;
        }

        .fab {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 168, 107, 0.3);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .fab:active { transform: scale(0.92); }
        .fab svg { width: 26px; height: 26px; }

        /* ===== CHAT WINDOW - FULL SCREEN ===== */
        .chat-window {
            display: none;
            flex-direction: column;
            flex: 1;
            background: var(--bg-primary);
            height: 100%;
            position: absolute;
            inset: 0;
            z-index: 25;
            max-width: 430px;
            margin: 0 auto;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.1);
        }
        .chat-window.active { display: flex; }

        .chat-header {
            background: var(--bg-primary);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 54px;
        }
        .chat-header .back-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .chat-header .back-btn:active { background: var(--bg-surface); }
        .chat-header .chat-user {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            cursor: pointer;
        }
        .chat-header .chat-user .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
            background: var(--bg-surface);
        }
        .chat-header .chat-user .user-info .name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
        }
        .chat-header .chat-user .user-info .status {
            font-size: 12px;
            color: var(--text-muted);
        }
        .chat-header .call-actions {
            display: flex;
            gap: 2px;
        }
        .chat-header .call-actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
        }
        .chat-header .call-actions button:active {
            background: var(--bg-surface);
            color: var(--primary);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-primary);
        }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: messageIn 0.2s ease-out;
            position: relative;
        }
        @keyframes messageIn {
            0% { opacity: 0; transform: translateY(8px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .message.sent {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.received {
            background: var(--bg-surface);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message .time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 4px;
            display: block;
            text-align: right;
        }
        .message .media-preview {
            margin: 6px -4px -4px;
            border-radius: 10px;
            overflow: hidden;
            max-width: 220px;
            cursor: pointer;
            position: relative;
        }
        .message .media-preview img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            display: block;
        }
        .message .media-preview .file-info {
            padding: 8px 12px;
            background: rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        /* ===== MESSAGE CONTEXT MENU ===== */
        .msg-context-menu {
            position: fixed;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 6px;
            z-index: 45;
            min-width: 160px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.15s ease-out;
        }
        .msg-context-menu button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 8px 14px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            border-radius: 8px;
            transition: var(--transition);
        }
        .msg-context-menu button:active { background: var(--bg-surface); }
        .msg-context-menu .danger { color: var(--danger); }

        .date-separator {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            padding: 8px 0;
            position: relative;
        }
        .date-separator::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: var(--border-color);
        }
        .date-separator span {
            background: var(--bg-primary);
            padding: 0 12px;
            position: relative;
            z-index: 1;
        }

        .composer {
            background: var(--bg-primary);
            padding: 8px 12px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .composer .attach-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .composer .attach-btn:active {
            background: var(--bg-surface);
            color: var(--primary);
        }
        .composer .input-wrapper {
            flex: 1;
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: flex-end;
            padding: 4px 12px;
            transition: var(--transition);
            min-height: 44px;
        }
        .composer .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.12);
        }
        .composer .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            resize: none;
            padding: 8px 0;
            max-height: 120px;
            min-height: 28px;
            font-family: inherit;
            line-height: 1.4;
        }
        .composer .input-wrapper textarea::placeholder { color: var(--text-muted); }
        .composer .send-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .composer .send-btn:active { transform: scale(0.92); }
        .composer .send-btn svg { width: 22px; height: 22px; }

        .attachment-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-primary);
            border-radius: 20px 20px 0 0;
            padding: 20px;
            z-index: 40;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            max-width: 430px;
            margin: 0 auto;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
        }
        .attachment-modal.active { transform: translateY(0); }
        .attachment-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .attachment-modal .modal-header h3 {
            font-size: 16px;
            font-weight: 700;
        }
        .attachment-modal .modal-header button {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
        }
        .attachment-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .attachment-grid button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px;
            background: var(--bg-surface);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 500;
        }
        .attachment-grid button:active {
            transform: scale(0.95);
            background: var(--bg-input);
        }
        .attachment-grid button svg {
            width: 24px;
            height: 24px;
            color: var(--primary);
        }

        @media (max-width: 430px) {
            #app { max-width: 100%; border-radius: 0; }
            .chat-window { max-width: 100%; }
        }
        @media (max-width: 380px) {
            .nav-item { min-width: 40px; font-size: 8px; }
            .nav-item svg { width: 20px; height: 20px; }
            .attachment-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>

        <!-- Chat List -->

        <button class="fab" onclick="window.location.href='contacts.html'" aria-label="New chat">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
        </button>

        <!-- Bottom Nav -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="chats" onclick="window.location.href='chat.html'">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
                <span>Chats</span>
                <span class="badge hidden" id="chat-badge">0</span>
            </button>
            <button class="nav-item" data-tab="contacts" onclick="window.location.href='contacts.html'">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
                <span>Contacts</span>
            </button>
        </nav>
    </div>

    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyC0v1HVCDfyO-nFdBJChpcB3ZxDOlCtFuQ",
            authDomain: "stardust-chat-1656d.firebaseapp.com",
            databaseURL: "https://stardust-chat-1656d-default-rtdb.firebaseio.com",
            projectId: "stardust-chat-1656d",
            storageBucket: "stardust-chat-1656d.firebasestorage.app",
            messagingSenderId: "676902329820",
            appId: "1:676902329820:web:576bb7bc0e6c9d3e0c4319",
            measurementId: "G-31GVGLYZDL"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // ================================================================
        // IMGBB API
        // ================================================================
        const IMGBB_API_KEY = '94dc61c3580abc8c9218268d0c773961';

        // ================================================================
        // STATE
        // ================================================================
        const state = {
            currentUser: null,
            uid: null,
            contacts: [],
            chats: [],
            messages: {},
            activeChatUID: null,
            isChatOpen: false,
            blocked: [],
            closeFriends: [],
        };

        // ================================================================
        // TOAST
        // ================================================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.add('active');
            if (window.toastTimeout) clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        // ================================================================
        // DARK MODE - PERSISTENT
        // ================================================================
        function applyDarkMode() {
            const saved = localStorage.getItem('stardust-dark-mode');
            if (saved === 'true') {
                document.body.classList.add('dark-mode');
            }
        }
        applyDarkMode();

        // ================================================================
        // MENU
        // ================================================================
        function toggleMainMenu() {
            document.getElementById('main-menu').classList.toggle('active');
        }
        function closeMenu(id) {
            document.getElementById(id)?.classList.remove('active');
        }
        function showSearch() {
            document.getElementById('search-input').focus();
        }

        // ================================================================
        // ATTACHMENT MENU
        // ================================================================
        function toggleAttachmentMenu() {
            document.getElementById('attachment-menu').classList.toggle('active');
        }

        // ================================================================
        // AUTH CHECK
        // ================================================================
        auth.onAuthStateChanged((user) => {
            document.getElementById('loading').style.display = 'none';

            if (!user) {
                window.location.href = 'auth.html';
                return;
            }

            db.ref('users').orderByChild('email').equalTo(user.email)
                .once('value')
                .then((snap) => {
                    const data = snap.val();
                    if (data) {
                        const keys = Object.keys(data);
                        for (let k of keys) {
                            if (data[k].email === user.email) {
                                state.currentUser = data[k];
                                state.uid = k;
                                state.blocked = data[k].blocked || [];
                                state.closeFriends = data[k].closeFriends || [];
                                break;
                            }
                        }
                    }
                    if (state.currentUser) {
                        if (state.currentUser.isSuspended) {
                            showToast('Your account has been suspended');
                            auth.signOut();
                            window.location.href = 'auth.html';
                            return;
                        }
                        initializeApp();
                    }
                });
        });

        // ================================================================
        // INITIALIZE
        // ================================================================
        function initializeApp() {
            // Listen for contacts
            db.ref('users/' + state.uid + '/contacts').on('value', (snap) => {
                state.contacts = snap.val() || [];
                buildChatList();
                renderChatList();
            });

            // Listen for blocked
            db.ref('users/' + state.uid + '/blocked').on('value', (snap) => {
                state.blocked = snap.val() || [];
                buildChatList();
                renderChatList();
            });

            // Listen for close friends
            db.ref('users/' + state.uid + '/closeFriends').on('value', (snap) => {
                state.closeFriends = snap.val() || [];
                buildChatList();
                renderChatList();
            });

            // Listen for messages
            db.ref('messages').on('value', (snap) => {
                const data = snap.val();
                if (data) {
                    state.messages = data;
                    buildChatList();
                    renderChatList();
                    if (state.activeChatUID && state.isChatOpen) {
                        renderMessages(state.activeChatUID);
                    }
                }
            });

            // Check for UID from URL (search)
            const params = new URLSearchParams(window.location.search);
            const uid = params.get('uid');
            if (uid && uid !== state.uid) {
                setTimeout(() => {
                    openChatByUID(uid);
                }, 500);
            }

            document.getElementById('search-input')?.addEventListener('input', (e) => {
                filterChatList(e.target.value);
            });

            const msgInput = document.getElementById('message-input');
            msgInput.addEventListener('input', () => {
                msgInput.style.height = 'auto';
                msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
            });
            msgInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            buildChatList();
            renderChatList();
            showToast('Welcome, ' + state.currentUser.name + '!');
        }

        // ================================================================
        // OPEN CHAT BY UID (from search)
        // ================================================================
        function openChatByUID(uid) {
            db.ref('users/' + uid).once('value').then((snap) => {
                const user = snap.val();
                if (!user) {
                    showToast('User not found');
                    return;
                }

                // Add to contacts if not already and not blocked
                if (!state.contacts.includes(uid) && !state.blocked.includes(uid)) {
                    state.contacts.push(uid);
                    db.ref('users/' + state.uid + '/contacts').set(state.contacts);
                }

                // Open chat
                openChat(uid);
            });
        }

        // ================================================================
        // OPEN CHAT - FULL SCREEN
        // ================================================================
        function openChat(uid) {
            if (state.blocked.includes(uid)) {
                showToast('This contact is blocked');
                return;
            }

            state.activeChatUID = uid;
            state.isChatOpen = true;

            db.ref('users/' + uid).once('value').then((snap) => {
                const user = snap.val();
                if (!user) return;

                document.getElementById('chat-window').classList.add('active');

                document.getElementById('chat-avatar').src = user.pfp ||
                    'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name) +
                    '&background=00A86B&color=fff&size=72';
                document.getElementById('chat-name').textContent = user.name;
                document.getElementById('chat-status').textContent = user.online ? 'online' : 'last seen recently';

                renderMessages(uid);
                markMessagesAsSeen(uid);

                const chat = state.chats.find(c => c.uid === uid);
                if (chat) chat.unreadCount = 0;
                renderChatList();

                document.getElementById('message-input').focus();
                toggleAttachmentMenu(false);
            });
        }

        // ================================================================
        // CLOSE CHAT WINDOW
        // ================================================================
        function closeChatWindow() {
            state.activeChatUID = null;
            state.isChatOpen = false;
            document.getElementById('chat-window').classList.remove('active');
            renderChatList();
            const url = new URL(window.location);
            url.searchParams.delete('uid');
            window.history.replaceState({}, document.title, url);
            document.getElementById('attachment-menu').classList.remove('active');
        }

        // ================================================================
        // BUILD CHAT LIST - WhatsApp Style
        // ================================================================
        function buildChatList() {
            state.chats = [];
            const contactList = state.contacts.filter(c => !state.blocked.includes(c));

            contactList.forEach(contactUID => {
                db.ref('users/' + contactUID).once('value').then((snap) => {
                    const contact = snap.val();
                    if (!contact) return;

                    const threadKey = state.uid < contactUID ? state.uid + '_' + contactUID : contactUID + '_' +
                        state.uid;
                    const msgs = state.messages[threadKey] || [];
                    const lastMsg = msgs.length > 0 ? msgs[msgs.length - 1] : null;
                    const unread = msgs.filter(m => m.sender === contactUID && !m.seen).length;

                    // Check if chat already exists
                    const existing = state.chats.find(c => c.uid === contactUID);
                    if (existing) {
                        existing.lastMessage = lastMsg ? lastMsg.text : 'No messages';
                        existing.lastMessageTime = lastMsg ? lastMsg.timestamp : 0;
                        existing.unreadCount = unread;
                    } else {
                        state.chats.push({
                            uid: contactUID,
                            name: contact.name || 'User',
                            pfp: contact.pfp ||
                                'https://ui-avatars.com/api/?name=User&background=00A86B&color=fff&size=72',
                            online: contact.online || false,
                            lastMessage: lastMsg ? lastMsg.text : 'No messages yet',
                            lastMessageTime: lastMsg ? lastMsg.timestamp : 0,
                            unreadCount: unread,
                            isCloseFriend: state.closeFriends.includes(contactUID),
                            isBlocked: state.blocked.includes(contactUID),
                        });
                    }

                    state.chats.sort((a, b) => (b.lastMessageTime || 0) - (a.lastMessageTime || 0));
                    renderChatList();
                });
            });
        }

        // ================================================================
        // RENDER CHAT LIST - WhatsApp Style
        // ================================================================
        function renderChatList() {
            const container = document.getElementById('chat-list');
            container.innerHTML = '';

            const chats = state.chats.filter(c => state.contacts.includes(c.uid) && !state.blocked.includes(c.uid));

            if (chats.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">
                            <svg width="56" height="56" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                            </svg>
                        </div>
                        <div class="title">No Chats Yet</div>
                        <div class="subtitle">Add a contact and start chatting</div>
                    </div>
                `;
                return;
            }

            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'chat-item';

                // Click opens chat
                const mainClick = () => openChat(chat.uid);
                div.addEventListener('click', mainClick);

                // Long press for context menu
                let longPressTimer;
                div.addEventListener('touchstart', () => {
                    longPressTimer = setTimeout(() => {
                        showChatContextMenu(0, 0, chat.uid);
                    }, 600);
                });
                div.addEventListener('touchend', () => clearTimeout(longPressTimer));
                div.addEventListener('touchmove', () => clearTimeout(longPressTimer));
                div.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    showChatContextMenu(e.clientX, e.clientY, chat.uid);
                });

                const timeStr = chat.lastMessageTime ? new Date(chat.lastMessageTime).toLocaleTimeString([], { hour
                        : '2-digit', minute: '2-digit' }) : '';

                const isUnread = chat.unreadCount > 0;
                const starIcon = chat.isCloseFriend ? '⭐' : '';

                div.innerHTML = `
                    <div class="avatar ${chat.online ? 'online' : ''}">
                        <img src="${chat.pfp}" alt="${chat.name}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" />
                        <span class="status-dot ${chat.online ? 'online' : 'offline'}"></span>
                    </div>
                    <div class="chat-info">
                        <div class="name-row">
                            <span class="name">${chat.name} ${starIcon}</span>
                            <span class="time">${timeStr}</span>
                        </div>
                        <div class="msg-row">
                            <span class="last-msg ${isUnread ? 'unread' : ''}">${chat.lastMessage || ''}</span>
                            ${isUnread ? `<span class="unread">${chat.unreadCount}</span>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });

            updateBadge();
        }

        function filterChatList(query) {
            const items = document.querySelectorAll('#chat-list .chat-item');
            const q = query.toLowerCase().trim();
            items.forEach(item => {
                const name = item.querySelector('.name')?.textContent?.toLowerCase() || '';
                const msg = item.querySelector('.last-msg')?.textContent?.toLowerCase() || '';
                item.style.display = name.includes(q) || msg.includes(q) ? 'flex' : 'none';
            });
        }

        function updateBadge() {
            const total = state.chats.reduce((sum, c) => sum + (c.unreadCount || 0), 0);
            const badge = document.getElementById('chat-badge');
            if (total > 0) {
                badge.textContent = total;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // ================================================================
        // CHAT CONTEXT MENU (Long press on chat item)
        // ================================================================
        function showChatContextMenu(x, y, uid) {
            document.querySelectorAll('.chat-context-menu').forEach(el => el.remove());

            const menu = document.createElement('div');
            menu.className = 'chat-context-menu';

            if (x === 0) {
                menu.style.left = '50%';
                menu.style.top = '50%';
                menu.style.transform = 'translate(-50%, -50%)';
            } else {
                menu.style.left = Math.min(x, window.innerWidth - 200) + 'px';
                menu.style.top = Math.min(y, window.innerHeight - 220) + 'px';
            }

            const isCloseFriend = state.closeFriends.includes(uid);

            menu.innerHTML = `
                <button onclick="deleteChatContact('${uid}')" class="danger">🗑️ Delete</button>
                <button onclick="blockChatContact('${uid}')">🚫 Block</button>
                <button onclick="toggleCloseFriend('${uid}')">${isCloseFriend ? '⭐ Remove Close Friend' : '⭐ Add to Close Friend'}</button>
                <button onclick="reportChatContact('${uid}')">⚠️ Report</button>
            `;

            document.body.appendChild(menu);

            setTimeout(() => {
                document.addEventListener('click', closeContextMenu);
            }, 10);
        }

        function closeContextMenu(e) {
            if (!e.target.closest('.chat-context-menu') && !e.target.closest('.msg-context-menu')) {
                document.querySelectorAll('.chat-context-menu').forEach(el => el.remove());
                document.querySelectorAll('.msg-context-menu').forEach(el => el.remove());
                document.removeEventListener('click', closeContextMenu);
            }
        }

        // ================================================================
        // CHAT CONTEXT ACTIONS
        // ================================================================
        function deleteChatContact(uid) {
            if (!confirm('Delete this chat from your list?')) return;
            state.contacts = state.contacts.filter(c => c !== uid);
            db.ref('users/' + state.uid + '/contacts').set(state.contacts);
            document.querySelectorAll('.chat-context-menu').forEach(el => el.remove());
            showToast('Chat removed from list');
        }

        function blockChatContact(uid) {
            if (!confirm('Block this contact?')) return;
            if (!state.blocked.includes(uid)) {
                state.blocked.push(uid);
                db.ref('users/' + state.uid + '/blocked').set(state.blocked);
                state.contacts = state.contacts.filter(c => c !== uid);
                db.ref('users/' + state.uid + '/contacts').set(state.contacts);
                document.querySelectorAll('.chat-context-menu').forEach(el => el.remove());
                showToast('Contact blocked');
                renderChatList();
            }
        }

        function toggleCloseFriend(uid) {
            if (state.closeFriends.includes(uid)) {
                state.closeFriends = state.closeFriends.filter(c => c !== uid);
                showToast('Removed from close friends');
            } else {
                state.closeFriends.push(uid);
                showToast('Added to close friends');
            }
            db.ref('users/' + state.uid + '/closeFriends').set(state.closeFriends);
            document.querySelectorAll('.chat-context-menu').forEach(el => el.remove());
            renderChatList();
        }

        function reportChatContact(uid) {
            const reason = prompt('Please enter the reason for reporting this user:');
            if (!reason) return;

            const reportRef = db.ref('reports');
            reportRef.push({
                reporterUID: state.uid,
                reporterName: state.currentUser.name,
                reportedUID: uid,
                reportedName: '',
                reason: reason,
                timestamp: Date.now(),
                status: 'pending'
            }).then(() => {
                // Get reported user name
                db.ref('users/' + uid).once('value').then((snap) => {
                    const user = snap.val();
                    if (user) {
                        reportRef.child('reportedName').set(user.name);
                    }
                });
                document.querySelectorAll('.chat-context-menu').forEach(el => el.remove());
                showToast('Report submitted to admin');
            }).catch((err) => {
                showToast('Error: ' + err.message);
            });
        }

        // ================================================================
        // RENDER MESSAGES
        // ================================================================
        function renderMessages(uid) {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';

            const threadKey = state.uid < uid ? state.uid + '_' + uid : uid + '_' + state.uid;
            const msgs = state.messages[threadKey] || [];

            if (msgs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding:40px 20px;">
                        <div class="icon">
                            <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                            </svg>
                        </div>
                        <div class="title" style="font-size:16px;">No messages yet</div>
                        <div class="subtitle" style="font-size:13px;">Say hello to start the conversation</div>
                    </div>
                `;
                return;
            }

            let lastDate = '';
            msgs.forEach((msg) => {
                const msgDate = new Date(msg.timestamp).toDateString();
                if (msgDate !== lastDate) {
                    lastDate = msgDate;
                    const sep = document.createElement('div');
                    sep.className = 'date-separator';
                    sep.innerHTML = `<span>${formatDate(msg.timestamp)}</span>`;
                    container.appendChild(sep);
                }

                const isSent = msg.sender === state.uid;
                const div = document.createElement('div');
                div.className = `message ${isSent ? 'sent' : 'received'}`;

                // Long press for message context menu
                div.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    showMsgContextMenu(e.clientX, e.clientY, threadKey, msg.id, isSent);
                });

                let longPressTimer;
                div.addEventListener('touchstart', () => {
                    longPressTimer = setTimeout(() => {
                        showMsgContextMenu(0, 0, threadKey, msg.id, isSent);
                    }, 600);
                });
                div.addEventListener('touchend', () => clearTimeout(longPressTimer));
                div.addEventListener('touchmove', () => clearTimeout(longPressTimer));

                if (msg.text) {
                    const p = document.createElement('p');
                    p.textContent = msg.text;
                    div.appendChild(p);
                }

                if (msg.mediaType && msg.mediaUrl) {
                    const mediaDiv = document.createElement('div');
                    mediaDiv.className = 'media-preview';

                    if (msg.mediaType === 'image') {
                        mediaDiv.innerHTML =
                            `<img src="${msg.mediaUrl}" alt="Image" onclick="window.open('${msg.mediaUrl}','_blank')" />`;
                    } else if (msg.mediaType === 'location') {
                        mediaDiv.innerHTML = `
                            <div style="padding:12px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.05);">
                                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                    <path d="M12 22s-8-4-8-10V5l8-3 8 3v7c0 6-8 10-8 10z"/>
                                    <circle cx="12" cy="10" r="3"/>
                                </svg>
                                <span>Location: ${msg.text || 'Shared location'}</span>
                            </div>
                        `;
                    } else {
                        mediaDiv.innerHTML = `
                            <div class="file-info">
                                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                    <path d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                                </svg>
                                <span>${msg.mediaName || 'Document'}</span>
                                ${msg.mediaUrl ? `<a href="${msg.mediaUrl}" target="_blank">Download</a>` : ''}
                            </div>
                        `;
                    }
                    div.appendChild(mediaDiv);
                }

                const timeSpan = document.createElement('span');
                timeSpan.className = 'time';
                timeSpan.textContent = formatTime(msg.timestamp);
                if (isSent) {
                    timeSpan.textContent += msg.seen ? ' ✓✓' : ' ✓';
                }
                div.appendChild(timeSpan);

                container.appendChild(div);
            });

            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 50);
        }

        // ================================================================
        // MESSAGE CONTEXT MENU
        // ================================================================
        function showMsgContextMenu(x, y, threadKey, msgId, isSent) {
            document.querySelectorAll('.msg-context-menu').forEach(el => el.remove());
            document.querySelectorAll('.chat-context-menu').forEach(el => el.remove());

            const msgs = state.messages[threadKey] || [];
            const msg = msgs.find(m => m.id === msgId);
            if (!msg) return;

            const menu = document.createElement('div');
            menu.className = 'msg-context-menu';

            if (x === 0) {
                menu.style.left = '50%';
                menu.style.top = '50%';
                menu.style.transform = 'translate(-50%, -50%)';
            } else {
                menu.style.left = Math.min(x, window.innerWidth - 200) + 'px';
                menu.style.top = Math.min(y, window.innerHeight - 200) + 'px';
            }

            let buttons = '';

            if (isSent) {
                buttons += `
                    <button onclick="editMessage('${threadKey}','${msgId}')">✏️ Edit</button>
                    <button onclick="copyMessage('${threadKey}','${msgId}')">📋 Copy</button>
                    <button onclick="deleteMessage('${threadKey}','${msgId}')" class="danger">🗑️ Delete</button>
                `;
            } else {
                buttons += `
                    <button onclick="copyMessage('${threadKey}','${msgId}')">📋 Copy</button>
                    <button onclick="deleteMessage('${threadKey}','${msgId}')" class="danger">🗑️ Delete</button>
                `;
            }

            menu.innerHTML = buttons;
            document.body.appendChild(menu);

            setTimeout(() => {
                document.addEventListener('click', closeContextMenu);
            }, 10);
        }

        // ================================================================
        // MESSAGE ACTIONS
        // ================================================================
        function copyMessage(threadKey, msgId) {
            const msgs = state.messages[threadKey] || [];
            const msg = msgs.find(m => m.id === msgId);
            if (msg && msg.text) {
                navigator.clipboard?.writeText(msg.text);
                showToast('Copied to clipboard');
            }
            document.querySelectorAll('.msg-context-menu').forEach(el => el.remove());
        }

        function deleteMessage(threadKey, msgId) {
            if (!confirm('Delete this message?')) return;
            const msgs = state.messages[threadKey] || [];
            state.messages[threadKey] = msgs.filter(m => m.id !== msgId);
            db.ref('messages/' + threadKey).set(state.messages[threadKey]);
            renderMessages(state.activeChatUID);
            renderChatList();
            document.querySelectorAll('.msg-context-menu').forEach(el => el.remove());
            showToast('Message deleted');
        }

        function editMessage(threadKey, msgId) {
            const msgs = state.messages[threadKey] || [];
            const msg = msgs.find(m => m.id === msgId);
            if (!msg) return;

            const newText = prompt('Edit message:', msg.text);
            if (newText !== null && newText.trim()) {
                msg.text = newText.trim();
                db.ref('messages/' + threadKey).set(msgs);
                renderMessages(state.activeChatUID);
                showToast('Message edited');
            }
            document.querySelectorAll('.msg-context-menu').forEach(el => el.remove());
        }

        // ================================================================
        // SEND MESSAGE
        // ================================================================
        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !state.activeChatUID) return;

            const uid = state.activeChatUID;
            const threadKey = state.uid < uid ? state.uid + '_' + uid : uid + '_' + state.uid;
            const msgs = state.messages[threadKey] || [];

            msgs.push({
                id: 'm' + Date.now(),
                sender: state.uid,
                text: text,
                timestamp: Date.now(),
                seen: false,
            });

            state.messages[threadKey] = msgs;
            db.ref('messages/' + threadKey).set(msgs);

            input.value = '';
            input.style.height = 'auto';

            const chat = state.chats.find(c => c.uid === uid);
            if (chat) {
                chat.lastMessage = text;
                chat.lastMessageTime = Date.now();
            }

            renderMessages(uid);
            renderChatList();
            showToast('Message sent');
        }

        // ================================================================
        // SEND MEDIA
        // ================================================================
        function sendMedia(type) {
            if (!state.activeChatUID) {
                showToast('Open a chat first');
                toggleAttachmentMenu();
                return;
            }

            toggleAttachmentMenu();

            const input = document.createElement('input');
            input.type = 'file';

            if (type === 'image' || type === 'camera') {
                input.accept = 'image/*';
                if (type === 'camera') input.capture = 'environment';
            } else if (type === 'video') {
                input.accept = 'video/*';
            } else if (type === 'document') {
                input.accept = '.pdf,.doc,.docx,.txt,.xls,.xlsx,.ppt,.pptx';
            } else if (type === 'file') {
                input.accept = '*/*';
            } else if (type === 'location') {
                sendLocation();
                return;
            }

            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                try {
                    showToast('Uploading...');

                    let mediaUrl = '';
                    let mediaType = 'document';
                    let mediaName = file.name;

                    if (type === 'image' || type === 'camera') {
                        mediaType = 'image';
                        const formData = new FormData();
                        formData.append('image', file);
                        formData.append('key', IMGBB_API_KEY);
                        const response = await fetch('https://api.imgbb.com/1/upload', {
                            method: 'POST',
                            body: formData
                        });
                        const data = await response.json();
                        if (data.success) {
                            mediaUrl = data.data.url;
                        } else {
                            throw new Error(data.error?.message || 'Upload failed');
                        }
                    } else if (type === 'video') {
                        const reader = new FileReader();
                        mediaUrl = await new Promise((resolve) => {
                            reader.onload = (ev) => resolve(ev.target.result);
                            reader.readAsDataURL(file);
                        });
                        mediaType = 'video';
                    } else {
                        const reader = new FileReader();
                        mediaUrl = await new Promise((resolve) => {
                            reader.onload = (ev) => resolve(ev.target.result);
                            reader.readAsDataURL(file);
                        });
                        mediaType = 'document';
                    }

                    const uid = state.activeChatUID;
                    const threadKey = state.uid < uid ? state.uid + '_' + uid : uid + '_' + state.uid;
                    const msgs = state.messages[threadKey] || [];

                    msgs.push({
                        id: 'm' + Date.now(),
                        sender: state.uid,
                        text: file.name,
                        timestamp: Date.now(),
                        seen: false,
                        mediaType: mediaType,
                        mediaUrl: mediaUrl,
                        mediaName: mediaName,
                    });

                    state.messages[threadKey] = msgs;
                    db.ref('messages/' + threadKey).set(msgs);

                    const chat = state.chats.find(c => c.uid === uid);
                    if (chat) {
                        chat.lastMessage = '📎 ' + file.name;
                        chat.lastMessageTime = Date.now();
                    }

                    renderMessages(uid);
                    renderChatList();
                    showToast('✅ ' + (type === 'image' ? 'Photo' : 'File') + ' sent');
                } catch (err) {
                    showToast('❌ Upload failed: ' + err.message);
                }
            };

            input.click();
        }

        // ================================================================
        // SEND LOCATION
        // ================================================================
        function sendLocation() {
            if (!state.activeChatUID) {
                showToast('Open a chat first');
                return;
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const { latitude, longitude } = pos.coords;
                        const uid = state.activeChatUID;
                        const threadKey = state.uid < uid ? state.uid + '_' + uid : uid + '_' + state.uid;
                        const msgs = state.messages[threadKey] || [];

                        msgs.push({
                            id: 'm' + Date.now(),
                            sender: state.uid,
                            text: `📍 Location: ${latitude.toFixed(6)}, ${longitude.toFixed(6)}`,
                            timestamp: Date.now(),
                            seen: false,
                            mediaType: 'location',
                            mediaUrl: `https://www.google.com/maps?q=${latitude},${longitude}`,
                        });

                        state.messages[threadKey] = msgs;
                        db.ref('messages/' + threadKey).set(msgs);

                        const chat = state.chats.find(c => c.uid === uid);
                        if (chat) {
                            chat.lastMessage = '📍 Location shared';
                            chat.lastMessageTime = Date.now();
                        }

                        renderMessages(uid);
                        renderChatList();
                        showToast('📍 Location shared');
                    },
                    () => showToast('Unable to get location')
                );
            } else {
                showToast('Geolocation not supported');
            }
        }

        // ================================================================
        // CALL SYSTEM
        // ================================================================
        let peer = null;
        let call = null;
        let localStream = null;
        let callDuration = 0;
        let callInterval = null;
        let isMuted = false;
        let isVideoOff = false;

        function startCall(type) {
            if (!state.activeChatUID) {
                showToast('Open a chat first');
                return;
            }

            const uid = state.activeChatUID;
            db.ref('users/' + uid).once('value').then((snap) => {
                const user = snap.val();
                if (!user) {
                    showToast('User not found');
                    return;
                }

                showToast(`Starting ${type} call with ${user.name}...`);

                setTimeout(() => {
                    showToast(`📞 ${type} call connected with ${user.name}`);
                }, 1500);
            });
        }

        // ================================================================
        // MARK MESSAGES AS SEEN
        // ================================================================
        function markMessagesAsSeen(uid) {
            const threadKey = state.uid < uid ? state.uid + '_' + uid : uid + '_' + state.uid;
            const msgs = state.messages[threadKey] || [];
            let updated = false;

            msgs.forEach(msg => {
                if (msg.sender !== state.uid && !msg.seen) {
                    msg.seen = true;
                    updated = true;
                }
            });

            if (updated) {
                db.ref('messages/' + threadKey).set(msgs);
                renderMessages(uid);
            }
        }

        // ================================================================
        // UTILITY
        // ================================================================
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            if (date.toDateString() === now.toDateString()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            if (date.toDateString() === today.toDateString()) return 'Today';
            if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';
            return date.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
        }

        console.log('🚀 Stardust X - Chat Page (Complete Fix)');
        console.log('✅ WhatsApp-style chat list with avatar, name, last msg, time, unread count');
        console.log('✅ Long press chat item: Delete, Block, Close Friend, Report');
        console.log('✅ Long press message: Edit, Copy, Delete (own) | Copy, Delete (received)');
        console.log('✅ Chat persists in list and contacts');
        console.log('✅ Dark mode works on all pages');
        console.log('✅ Reports sent to admin panel');
    </script>
</body>
