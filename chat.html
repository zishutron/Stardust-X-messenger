<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Chats - Stardust X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        /* ================================================================
           CHAT PAGE STYLES
           ================================================================ */
        :root {
            --primary: #00A86B;
            --primary-light: #00C97A;
            --primary-dark: #008A56;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F5F9F7;
            --bg-surface: #ECF5F0;
            --bg-input: #F0F7F3;
            --text-primary: #1A2E24;
            --text-secondary: #4A6A5A;
            --text-muted: #8AAA9A;
            --border-color: #D4E8DE;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.25s ease;
            --danger: #EF4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .scrollbar-custom::-webkit-scrollbar {
            width: 3px;
        }
        .scrollbar-custom::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollbar-custom::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        #app {
            max-width: 430px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 168, 107, 0.05);
        }

        /* Header */
        .app-header {
            background: var(--bg-primary);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 54px;
        }
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .app-header .logo .icon {
            width: 34px;
            height: 34px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .app-header .logo .icon svg {
            width: 22px;
            height: 22px;
        }
        .app-header .logo .brand {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .app-header .logo .brand .x {
            color: var(--primary);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .header-actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-actions button:active {
            background: var(--bg-surface);
            color: var(--primary);
        }

        /* Bottom Nav */
        .bottom-nav {
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 4px 0 8px;
            flex-shrink: 0;
            min-height: 56px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 12px;
            transition: var(--transition);
            font-size: 9px;
            font-weight: 500;
            min-width: 50px;
            position: relative;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            transition: var(--transition);
        }
        .nav-item.active {
            color: var(--primary);
        }
        .nav-item.active svg {
            transform: translateY(-2px);
        }
        .nav-item .badge {
            position: absolute;
            top: -2px;
            right: -4px;
            background: var(--danger);
            color: white;
            font-size: 8px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 1.5px solid var(--bg-primary);
        }
        .nav-item .badge.hidden {
            display: none;
        }

        /* Search Bar */
        .search-bar {
            padding: 8px 16px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }
        .search-bar input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.12);
        }
        .search-bar input::placeholder {
            color: var(--text-muted);
        }
        .search-wrapper {
            position: relative;
        }
        .search-wrapper .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Chat List */
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
            background: var(--bg-primary);
        }
        .list-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 12px;
            margin: 2px 8px;
            position: relative;
        }
        .list-item:active {
            background: var(--bg-surface);
            transform: scale(0.98);
        }
        .list-item .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
            border: 2px solid var(--border-color);
            background: var(--bg-surface);
        }
        .list-item .avatar.online {
            border-color: var(--primary);
        }
        .list-item .info {
            flex: 1;
            min-width: 0;
        }
        .list-item .info .name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-item .info .name-row .name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-item .info .name-row .time {
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-left: 8px;
        }
        .list-item .info .msg-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }
        .list-item .info .msg-row .sub {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .list-item .unread {
            background: var(--primary);
            color: white;
            font-size: 11px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            flex-shrink: 0;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            flex: 1;
            height: 100%;
        }
        .empty-state .icon {
            color: var(--text-muted);
            opacity: 0.3;
            margin-bottom: 16px;
        }
        .empty-state .title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .empty-state .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 280px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            animation: toastIn 0.3s ease-out;
            max-width: 90%;
            text-align: center;
            font-size: 14px;
            display: none;
            font-weight: 500;
        }
        .toast.active {
            display: block;
        }
        @keyframes toastIn {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Loading */
        #loading {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #loading .brand {
            margin-top: 16px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        #loading .brand .x {
            color: var(--primary);
        }

        /* Menu Dropdown */
        .menu-dropdown {
            position: absolute;
            top: 54px;
            right: 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 6px;
            min-width: 200px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            z-index: 30;
            display: none;
            animation: slideUp 0.2s ease-out;
        }
        .menu-dropdown.active {
            display: block;
        }
        .menu-dropdown .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            color: var(--text-primary);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .menu-dropdown .menu-item:active {
            background: var(--bg-surface);
        }
        .menu-dropdown .menu-item .icon {
            color: var(--text-secondary);
            width: 20px;
            text-align: center;
        }
        .menu-dropdown .divider {
            height: 1px;
            background: var(--border-color);
            margin: 4px 8px;
        }

        /* FAB */
        .fab {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 168, 107, 0.3);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .fab:active {
            transform: scale(0.92);
        }
        .fab svg {
            width: 26px;
            height: 26px;
        }

        @media (max-width: 430px) {
            #app { max-width: 100%; border-radius: 0; }
        }
        @media (max-width: 380px) {
            .nav-item { min-width: 40px; font-size: 8px; }
            .nav-item svg { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>

    <!-- Loading -->
    <div id="loading">
        <div class="spinner"></div>
        <div class="brand">Stardust <span class="x">X</span></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <span id="toast-message">Success!</span>
    </div>

    <!-- App -->
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="logo" onclick="window.location.href='chat.html'">
                <div class="icon">
                    <svg viewBox="0 0 40 40" fill="none">
                        <rect x="4" y="4" width="32" height="32" rx="8" fill="white" />
                        <path d="M12 20 L18 26 L30 14" stroke="#00A86B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 14 L28 14 L28 20" stroke="#00A86B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="brand">Stardust <span class="x">X</span></span>
            </div>
            <div class="header-actions">
                <button onclick="showSearch()" aria-label="Search">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/>
                    </svg>
                </button>
                <div style="position:relative;">
                    <button onclick="toggleMainMenu()" aria-label="Menu">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
                        </svg>
                    </button>
                    <div id="main-menu" class="menu-dropdown">
                        <button class="menu-item" onclick="closeMenu('main-menu');window.location.href='contacts.html'">
                            <span class="icon">+</span> Add New Contact
                        </button>
                        <button class="menu-item" onclick="closeMenu('main-menu');showToast('Blocked contacts page')">
                            <span class="icon">🚫</span> Blocked Contacts
                        </button>
                        <button class="menu-item" onclick="closeMenu('main-menu');showToast('Close friends page')">
                            <span class="icon">⭐</span> Close Friends
                        </button>
                        <div class="divider"></div>
                        <button class="menu-item" onclick="closeMenu('main-menu');window.location.href='settings.html'">
                            <span class="icon">⚙️</span> Settings
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Chat List -->
        <div class="search-bar">
            <div class="search-wrapper">
                <span class="search-icon">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/>
                    </svg>
                </span>
                <input type="text" id="search-input" placeholder="Search chats..." />
            </div>
        </div>
        <div class="list-container scrollbar-custom" id="chat-list">
            <!-- Rendered by JS -->
        </div>

        <button class="fab" onclick="window.location.href='contacts.html'" aria-label="New chat">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
        </button>

        <!-- Bottom Nav -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="chats" onclick="window.location.href='chat.html'">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
                <span>Chats</span>
                <span class="badge hidden" id="chat-badge">0</span>
            </button>
            <button class="nav-item" data-tab="contacts" onclick="window.location.href='contacts.html'">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
                <span>Contacts</span>
            </button>
            <button class="nav-item" data-tab="settings" onclick="window.location.href='settings.html'">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                </svg>
                <span>Settings</span>
            </button>
        </nav>
    </div>

    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyC0v1HVCDfyO-nFdBJChpcB3ZxDOlCtFuQ",
            authDomain: "stardust-chat-1656d.firebaseapp.com",
            databaseURL: "https://stardust-chat-1656d-default-rtdb.firebaseio.com",
            projectId: "stardust-chat-1656d",
            storageBucket: "stardust-chat-1656d.firebasestorage.app",
            messagingSenderId: "676902329820",
            appId: "1:676902329820:web:576bb7bc0e6c9d3e0c4319",
            measurementId: "G-31GVGLYZDL"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // ================================================================
        // STATE
        // ================================================================
        const state = {
            currentUser: null,
            uid: null,
            contacts: [],
            chats: [],
            messages: {},
        };

        // ================================================================
        // TOAST
        // ================================================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.add('active');
            if (window.toastTimeout) clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        // ================================================================
        // MENU
        // ================================================================
        function toggleMainMenu() {
            document.getElementById('main-menu').classList.toggle('active');
        }

        function closeMenu(id) {
            document.getElementById(id)?.classList.remove('active');
        }

        function showSearch() {
            document.getElementById('search-input').focus();
        }

        // ================================================================
        // AUTH CHECK
        // ================================================================
        auth.onAuthStateChanged((user) => {
            document.getElementById('loading').style.display = 'none';

            if (!user) {
                window.location.href = 'auth.html';
                return;
            }

            // Get user data
            db.ref('users').orderByChild('email').equalTo(user.email)
                .once('value')
                .then((snap) => {
                    const data = snap.val();
                    if (data) {
                        const keys = Object.keys(data);
                        for (let k of keys) {
                            if (data[k].email === user.email) {
                                state.currentUser = data[k];
                                state.uid = k;
                                break;
                            }
                        }
                    }
                    if (state.currentUser) {
                        initializeApp();
                    }
                });
        });

        // ================================================================
        // INITIALIZE
        // ================================================================
        function initializeApp() {
            // Listen for contacts
            db.ref('users/' + state.uid + '/contacts').on('value', (snap) => {
                state.contacts = snap.val() || [];
                buildChatList();
                renderChatList();
            });

            // Listen for messages
            db.ref('messages').on('value', (snap) => {
                const data = snap.val();
                if (data) {
                    state.messages = data;
                    buildChatList();
                    renderChatList();
                }
            });

            // Search
            document.getElementById('search-input')?.addEventListener('input', (e) => {
                filterChatList(e.target.value);
            });

            buildChatList();
            renderChatList();

            showToast('Welcome, ' + state.currentUser.name + '!');
        }

        // ================================================================
        // CHAT LIST
        // ================================================================
        function buildChatList() {
            state.chats = [];

            state.contacts.forEach(contactUID => {
                db.ref('users/' + contactUID).once('value').then((snap) => {
                    const contact = snap.val();
                    if (!contact) return;

                    const threadKey = state.uid < contactUID ? state.uid + '_' + contactUID : contactUID + '_' +
                        state.uid;
                    const msgs = state.messages[threadKey] || [];
                    const lastMsg = msgs.length > 0 ? msgs[msgs.length - 1] : null;
                    const unread = msgs.filter(m => m.sender === contactUID && !m.seen).length;

                    state.chats.push({
                        uid: contactUID,
                        name: contact.name || 'User',
                        pfp: contact.pfp ||
                        'https://ui-avatars.com/api/?name=User&background=00A86B&color=fff&size=72',
                        online: contact.online || false,
                        lastMessage: lastMsg ? lastMsg.text : 'No messages yet',
                        lastMessageTime: lastMsg ? lastMsg.timestamp : 0,
                        unreadCount: unread,
                    });

                    state.chats.sort((a, b) => (b.lastMessageTime || 0) - (a.lastMessageTime || 0));
                    renderChatList();
                });
            });
        }

        function renderChatList() {
            const container = document.getElementById('chat-list');
            container.innerHTML = '';

            if (state.chats.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">
                            <svg width="56" height="56" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                            </svg>
                        </div>
                        <div class="title">No Chats Yet</div>
                        <div class="subtitle">Add a contact and start chatting</div>
                    </div>
                `;
                return;
            }

            state.chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.onclick = () => showToast('Open chat with ' + chat.name);

                const timeStr = chat.lastMessageTime ? new Date(chat.lastMessageTime).toLocaleTimeString([], { hour
                        : '2-digit', minute: '2-digit' }) : '';

                div.innerHTML = `
                    <img src="${chat.pfp}" alt="${chat.name}" class="avatar ${chat.online ? 'online' : ''}" />
                    <div class="info">
                        <div class="name-row">
                            <span class="name">${chat.name}</span>
                            <span class="time">${timeStr}</span>
                        </div>
                        <div class="msg-row">
                            <span class="sub">${chat.lastMessage || ''}</span>
                            ${chat.unreadCount > 0 ? `<span class="unread">${chat.unreadCount}</span>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });

            updateBadge();
        }

        function filterChatList(query) {
            const items = document.querySelectorAll('#chat-list .list-item');
            const q = query.toLowerCase().trim();
            items.forEach(item => {
                const name = item.querySelector('.name')?.textContent?.toLowerCase() || '';
                const msg = item.querySelector('.sub')?.textContent?.toLowerCase() || '';
                item.style.display = name.includes(q) || msg.includes(q) ? 'flex' : 'none';
            });
        }

        function updateBadge() {
            const total = state.chats.reduce((sum, c) => sum + (c.unreadCount || 0), 0);
            const badge = document.getElementById('chat-badge');
            if (total > 0) {
                badge.textContent = total;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        console.log('🚀 Stardust X - Chat Page');
    </script>
</body>
</html>
