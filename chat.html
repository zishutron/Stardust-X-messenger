<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Chats - Stardust X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        /* ================================================================
           COMPLETE CHAT STYLES
           ================================================================ */
        :root {
            --primary: #00A86B;
            --primary-light: #00C97A;
            --primary-dark: #008A56;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F5F9F7;
            --bg-surface: #ECF5F0;
            --bg-input: #F0F7F3;
            --text-primary: #1A2E24;
            --text-secondary: #4A6A5A;
            --text-muted: #8AAA9A;
            --border-color: #D4E8DE;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.25s ease;
            --danger: #EF4444;
            --warning: #F59E0B;
        }

        .dark-mode {
            --bg-primary: #1A1A2E;
            --bg-secondary: #0F0F1A;
            --bg-surface: #2A2A44;
            --bg-input: #22223A;
            --text-primary: #F0F0F5;
            --text-secondary: #B0B0C8;
            --text-muted: #7A7A94;
            --border-color: #33334A;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .scrollbar-custom::-webkit-scrollbar { width: 3px; }
        .scrollbar-custom::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-custom::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        #app {
            max-width: 430px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 168, 107, 0.05);
        }

        .app-header {
            background: var(--bg-primary);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 54px;
        }
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .app-header .logo .icon {
            width: 34px;
            height: 34px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .app-header .logo .icon svg { width: 22px; height: 22px; }
        .app-header .logo .brand {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .app-header .logo .brand .x { color: var(--primary); }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .header-actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-actions button:active {
            background: var(--bg-surface);
            color: var(--primary);
        }

        .bottom-nav {
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 4px 0 8px;
            flex-shrink: 0;
            min-height: 56px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 12px;
            transition: var(--transition);
            font-size: 9px;
            font-weight: 500;
            min-width: 50px;
            position: relative;
        }
        .nav-item svg { width: 24px; height: 24px; transition: var(--transition); }
        .nav-item.active { color: var(--primary); }
        .nav-item.active svg { transform: translateY(-2px); }
        .nav-item .badge {
            position: absolute;
            top: -2px;
            right: -4px;
            background: var(--danger);
            color: white;
            font-size: 8px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 1.5px solid var(--bg-primary);
        }
        .nav-item .badge.hidden { display: none; }

        .search-bar {
            padding: 8px 16px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }
        .search-bar input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.12);
        }
        .search-bar input::placeholder { color: var(--text-muted); }
        .search-wrapper { position: relative; }
        .search-wrapper .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
            background: var(--bg-primary);
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 12px;
            margin: 2px 8px;
            position: relative;
        }
        .chat-item:active { background: var(--bg-surface); transform: scale(0.98); }
        .chat-item .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
            border: 2px solid var(--border-color);
            background: var(--bg-surface);
            position: relative;
        }
        .chat-item .avatar.online { border-color: var(--primary); }
        .chat-item .avatar .status-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--bg-primary);
        }
        .chat-item .avatar .status-dot.online { background: var(--primary); }
        .chat-item .avatar .status-dot.offline { background: var(--text-muted); }

        .chat-item .chat-info { flex: 1; min-width: 0; }
        .chat-item .chat-info .name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-item .chat-info .name-row .name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-item .chat-info .name-row .time {
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-left: 8px;
        }
        .chat-item .chat-info .msg-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }
        .chat-item .chat-info .msg-row .last-msg {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .chat-item .chat-info .msg-row .last-msg.unread {
            color: var(--text-primary);
            font-weight: 500;
        }
        .chat-item .unread {
            background: var(--primary);
            color: white;
            font-size: 11px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            flex-shrink: 0;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            flex: 1;
            height: 100%;
        }
        .empty-state .icon { color: var(--text-muted); opacity: 0.3; margin-bottom: 16px; }
        .empty-state .title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .empty-state .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 280px;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            animation: toastIn 0.3s ease-out;
            max-width: 90%;
            text-align: center;
            font-size: 14px;
            display: none;
            font-weight: 500;
        }
        .toast.active { display: block; }
        @keyframes toastIn {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        #loading {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading .brand {
            margin-top: 16px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        #loading .brand .x { color: var(--primary); }

        .menu-dropdown {
            position: absolute;
            top: 54px;
            right: 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 6px;
            min-width: 200px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            z-index: 30;
            display: none;
            animation: slideUp 0.2s ease-out;
        }
        .menu-dropdown.active { display: block; }
        .menu-dropdown .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            color: var(--text-primary);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .menu-dropdown .menu-item:active { background: var(--bg-surface); }
        .menu-dropdown .menu-item .icon {
            color: var(--text-secondary);
            width: 20px;
            text-align: center;
        }
        .menu-dropdown .divider {
            height: 1px;
            background: var(--border-color);
            margin: 4px 8px;
        }

        .fab {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 168, 107, 0.3);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .fab:active { transform: scale(0.92); }
        .fab svg { width: 26px; height: 26px; }

        /* ===== CHAT WINDOW ===== */
        .chat-window {
            display: none;
            flex-direction: column;
            flex: 1;
            background: var(--bg-primary);
            height: 100%;
            position: absolute;
            inset: 0;
            z-index: 25;
            max-width: 430px;
            margin: 0 auto;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.1);
        }
        .chat-window.active { display: flex; }

        .chat-header {
            background: var(--bg-primary);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 54px;
        }
        .chat-header .back-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .chat-header .back-btn:active { background: var(--bg-surface); }
        .chat-header .chat-user {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            cursor: pointer;
        }
        .chat-header .chat-user .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
            background: var(--bg-surface);
        }
        .chat-header .chat-user .user-info .name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
        }
        .chat-header .chat-user .user-info .status {
            font-size: 12px;
            color: var(--text-muted);
        }
        .chat-header .call-actions {
            display: flex;
            gap: 2px;
        }
        .chat-header .call-actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
        }
        .chat-header .call-actions button:active {
            background: var(--bg-surface);
            color: var(--primary);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-primary);
        }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: messageIn 0.2s ease-out;
            position: relative;
        }
        @keyframes messageIn {
            0% { opacity: 0; transform: translateY(8px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .message.sent {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.received {
            background: var(--bg-surface);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message .time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 4px;
            display: block;
            text-align: right;
        }

        /* ===== REACTION DISPLAY ===== */
        .message .reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            margin-top: 4px;
        }
        .message .reactions .reaction-badge {
            background: rgba(255,255,255,0.15);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        .message.sent .reactions .reaction-badge {
            background: rgba(255,255,255,0.2);
        }
        .message.received .reactions .reaction-badge {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
        }

        /* ===== MEDIA PREVIEW ===== */
        .message .media-preview {
            margin: 6px -4px -4px;
            border-radius: 10px;
            overflow: hidden;
            max-width: 220px;
            cursor: pointer;
            position: relative;
        }
        .message .media-preview img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            display: block;
        }

        /* ===== DOCUMENT PREVIEW ===== */
        .message .document-preview {
            margin: 6px -4px -4px;
            border-radius: 10px;
            overflow: hidden;
            max-width: 220px;
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
        }
        .message.sent .document-preview {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }
        .message .document-preview .doc-header {
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .message .document-preview .doc-header .doc-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
        }
        .message .document-preview .doc-header .doc-name {
            flex: 1;
            font-size: 12px;
            font-weight: 500;
            word-break: break-all;
        }
        .message .document-preview .doc-actions {
            display: flex;
            gap: 4px;
            padding: 6px 10px;
        }
        .message .document-preview .doc-actions button {
            flex: 1;
            padding: 4px 8px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .message .document-preview .doc-actions button:active { transform: scale(0.95); }
        .message .document-preview .doc-actions .view-btn {
            background: var(--bg-input);
            color: var(--text-primary);
        }
        .message .document-preview .doc-actions .view-btn:hover {
            background: var(--bg-surface);
        }
        .message .document-preview .doc-actions .download-btn {
            background: var(--primary);
            color: white;
        }
        .message .document-preview .doc-actions .download-btn:hover {
            background: var(--primary-dark);
        }

        /* ===== LOCATION MAP ===== */
        .location-map {
            width: 100%;
            max-width: 220px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 4px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-surface);
        }
        .location-map:hover { transform: scale(1.02); }
        .location-map .map-container {
            width: 100%;
            height: 120px;
            position: relative;
            background: #e8f0fe;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .location-map .map-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .location-map .map-container .map-placeholder {
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
            padding: 10px;
        }
        .location-map .map-container .map-placeholder svg {
            display: block;
            margin: 0 auto 4px;
        }
        .location-map .map-info {
            padding: 6px 10px;
            background: var(--bg-surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .location-map .map-info .open-map {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }
        .message.sent .location-map .map-info {
            background: rgba(255,255,255,0.1);
        }
        .message.sent .location-map .map-info .open-map { color: #fff; }

        .date-separator {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            padding: 8px 0;
            position: relative;
        }
        .date-separator::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: var(--border-color);
        }
        .date-separator span {
            background: var(--bg-primary);
            padding: 0 12px;
            position: relative;
            z-index: 1;
        }

        .composer {
            background: var(--bg-primary);
            padding: 8px 12px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .composer .attach-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .composer .attach-btn:active {
            background: var(--bg-surface);
            color: var(--primary);
        }
        .composer .input-wrapper {
            flex: 1;
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: flex-end;
            padding: 4px 12px;
            transition: var(--transition);
            min-height: 44px;
        }
        .composer .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.12);
        }
        .composer .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            resize: none;
            padding: 8px 0;
            max-height: 120px;
            min-height: 28px;
            font-family: inherit;
            line-height: 1.4;
        }
        .composer .input-wrapper textarea::placeholder { color: var(--text-muted); }
        .composer .send-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .composer .send-btn:active { transform: scale(0.92); }
        .composer .send-btn svg { width: 22px; height: 22px; }

        /* ===== ATTACHMENT MODAL ===== */
        .attachment-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-primary);
            border-radius: 20px 20px 0 0;
            padding: 20px;
            z-index: 40;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            max-width: 430px;
            margin: 0 auto;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
        }
        .attachment-modal.active { transform: translateY(0); }
        .attachment-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .attachment-modal .modal-header h3 {
            font-size: 16px;
            font-weight: 700;
        }
        .attachment-modal .modal-header button {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
        }
        .attachment-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .attachment-grid button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px;
            background: var(--bg-surface);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 500;
        }
        .attachment-grid button:active {
            transform: scale(0.95);
            background: var(--bg-input);
        }
        .attachment-grid button svg {
            width: 24px;
            height: 24px;
            color: var(--primary);
        }

        /* ===== CONTEXT MENU - FIXED: ALL BUTTONS TOGETHER ===== */
        .context-menu {
            position: fixed;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 8px;
            z-index: 45;
            min-width: 200px;
            max-width: 280px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.15s ease-out;
        }
        .context-menu .menu-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 4px 4px 8px 4px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 4px;
        }
        .context-menu .menu-row .reaction-btn {
            background: transparent;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: var(--transition);
            flex: 1;
            min-width: 36px;
            text-align: center;
        }
        .context-menu .menu-row .reaction-btn:active {
            background: var(--bg-surface);
            transform: scale(1.15);
        }
        .context-menu .action-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .context-menu .action-row button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 8px 14px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            border-radius: 8px;
            transition: var(--transition);
        }
        .context-menu .action-row button:active { background: var(--bg-surface); }
        .context-menu .action-row .danger { color: var(--danger); }
        .context-menu .action-row .divider {
            height: 1px;
            background: var(--border-color);
            margin: 2px 8px;
        }

        /* ===== PHOTO VIEWER ===== */
        #photo-viewer {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 70;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #photo-viewer.active { display: flex; }
        #photo-viewer .viewer-actions {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
        }
        #photo-viewer .viewer-actions button {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #photo-viewer .viewer-actions button:active {
            background: rgba(255,255,255,0.25);
            transform: scale(0.95);
        }
        #photo-viewer .viewer-actions .save-btn {
            background: var(--primary);
            border-color: var(--primary);
        }
        #photo-viewer .viewer-actions .save-btn:hover {
            background: var(--primary-dark);
        }
        #photo-viewer img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            object-fit: contain;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ===== DOCUMENT VIEWER ===== */
        #document-viewer {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 70;
            display: none;
            flex-direction: column;
            padding: 60px 20px 20px;
        }
        #document-viewer.active { display: flex; }
        #document-viewer .doc-viewer-header {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
        }
        #document-viewer .doc-viewer-header button {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: var(--transition);
        }
        #document-viewer .doc-viewer-header button:active {
            background: rgba(255,255,255,0.25);
            transform: scale(0.95);
        }
        #document-viewer .doc-viewer-content {
            flex: 1;
            overflow-y: auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            color: #1A2E24;
            font-size: 14px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 80vh;
        }

        /* ===== CALL OVERLAY - FIXED SVGS ===== */
        .call-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 60;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px 40px;
        }
        .call-overlay.active { display: flex; }
        .call-overlay .call-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary);
            box-shadow: 0 0 60px rgba(0,168,107,0.2);
        }
        .call-overlay .call-name {
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-top: 12px;
        }
        .call-overlay .call-status {
            font-size: 14px;
            color: #8AAA9A;
            margin-top: 4px;
        }
        .call-overlay .call-duration {
            font-size: 18px;
            color: #B0B0C8;
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }

        .call-overlay .call-bottom-actions {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
            padding-bottom: 10px;
            flex-wrap: wrap;
        }
        .call-overlay .call-bottom-actions button {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #334155;
            color: white;
        }
        .call-overlay .call-bottom-actions button:active { transform: scale(0.92); }
        .call-overlay .call-bottom-actions button svg { width: 24px; height: 24px; }
        .call-overlay .call-bottom-actions .end-call {
            background: #EF4444;
            color: white;
            width: 64px;
            height: 64px;
        }
        .call-overlay .call-bottom-actions .call-control.active {
            background: var(--primary);
        }
        .call-overlay .call-bottom-actions .call-control.accept {
            background: var(--primary);
            color: white;
            width: 64px;
            height: 64px;
        }

        /* ===== INCOMING CALL OVERLAY ===== */
        #incoming-call-actions {
            display: none;
            width: 100%;
            justify-content: center;
            gap: 20px;
            padding-bottom: 20px;
        }
        #incoming-call-actions.active { display: flex; }

        /* ===== FLOATING CALL ===== */
        .floating-call {
            position: fixed;
            bottom: 80px;
            right: 16px;
            width: 140px;
            height: 190px;
            border-radius: var(--radius);
            overflow: hidden;
            z-index: 40;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            cursor: grab;
            display: none;
        }
        .floating-call.active { display: block; }
        .floating-call .caller-info {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 10px;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
            white-space: nowrap;
        }
        .floating-call .call-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
        }
        .floating-call .call-actions button {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 430px) {
            #app { max-width: 100%; border-radius: 0; }
            .chat-window { max-width: 100%; }
            .context-menu { max-width: 240px; }
            .context-menu .menu-row .reaction-btn { font-size: 20px; padding: 2px 6px; min-width: 30px; }
            .call-overlay .call-bottom-actions button { width: 48px; height: 48px; }
            .call-overlay .call-bottom-actions button svg { width: 20px; height: 20px; }
            .call-overlay .call-bottom-actions .end-call { width: 56px; height: 56px; }
            .call-overlay .call-bottom-actions .call-control.accept { width: 56px; height: 56px; }
        }
        @media (max-width: 380px) {
            .nav-item { min-width: 40px; font-size: 8px; }
            .nav-item svg { width: 20px; height: 20px; }
            .attachment-grid { grid-template-columns: repeat(3, 1fr); }
            .context-menu { max-width: 200px; }
            .context-menu .menu-row .reaction-btn { font-size: 18px; padding: 2px 4px; min-width: 26px; }
        }
    </style>
</head>
<body>

    <!-- Loading -->
    <div id="loading">
        <div class="spinner"></div>
        <div class="brand">Stardust <span class="x">X</span></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <span id="toast-message">Success!</span>
    </div>

    <!-- App -->
    <div id="app">

        <!-- Header -->
        <header class="app-header">
            <div class="logo" onclick="closeChatWindow();">
                <div class="icon">
                    <svg viewBox="0 0 40 40" fill="none">
                        <rect x="4" y="4" width="32" height="32" rx="8" fill="white" />
                        <path d="M12 20 L18 26 L30 14" stroke="#00A86B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 14 L28 14 L28 20" stroke="#00A86B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="brand">Stardust <span class="x">X</span></span>
            </div>
            <div class="header-actions">
                <button onclick="showSearch()" aria-label="Search">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/>
                    </svg>
                </button>
                <div style="position:relative;">
                    <button onclick="toggleMainMenu()" aria-label="Menu">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
                        </svg>
                    </button>
                    <div id="main-menu" class="menu-dropdown">
                        <button class="menu-item" onclick="closeMenu('main-menu');window.location.href='contacts.html'">
                            <span class="icon">+</span> Add New Contact
                        </button>
                        <button class="menu-item" onclick="closeMenu('main-menu');showToast('Blocked contacts')">
                            <span class="icon">X</span> Blocked Contacts
                        </button>
                        <button class="menu-item" onclick="closeMenu('main-menu');showToast('Close friends')">
                            <span class="icon">*</span> Close Friends
                        </button>
                        <div class="divider"></div>
                        <button class="menu-item" onclick="closeMenu('main-menu');window.location.href='settings.html'">
                            <span class="icon">⚙</span> Settings
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Chat List -->
        <div class="search-bar">
            <div class="search-wrapper">
                <span class="search-icon">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/>
                    </svg>
                </span>
                <input type="text" id="search-input" placeholder="Search chats..." />
            </div>
        </div>
        <div class="list-container scrollbar-custom" id="chat-list">
            <!-- Rendered by JS -->
        </div>

        <!-- Chat Window -->
        <div id="chat-window" class="chat-window">
            <div class="chat-header">
                <button class="back-btn" onclick="closeChatWindow()" aria-label="Back">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <div class="chat-user">
                    <img id="chat-avatar" src="" alt="Avatar" class="avatar" />
                    <div class="user-info">
                        <div class="name" id="chat-name">User</div>
                        <div class="status" id="chat-status">online</div>
                    </div>
                </div>
                <div class="call-actions">
                    <button onclick="startCall('audio')" aria-label="Voice call">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                        </svg>
                    </button>
                    <button onclick="startCall('video')" aria-label="Video call">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="messages-container scrollbar-custom" id="messages-container">
                <!-- Rendered by JS -->
            </div>

            <div class="composer">
                <button class="attach-btn" onclick="toggleAttachmentMenu()" aria-label="Attach">
                    <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 4.5"/>
                    </svg>
                </button>
                <div class="input-wrapper">
                    <textarea id="message-input" rows="1" placeholder="Type a message..." aria-label="Message input"></textarea>
                </div>
                <button class="send-btn" onclick="sendMessage()" aria-label="Send">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Attachment Menu -->
        <div id="attachment-menu" class="attachment-modal">
            <div class="modal-header">
                <h3>Attach</h3>
                <button onclick="toggleAttachmentMenu()">✕</button>
            </div>
            <div class="attachment-grid">
                <button onclick="sendMedia('image')">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <path d="M21 15l-5-5L5 21"/>
                    </svg>
                    Photo
                </button>
                <button onclick="sendMedia('camera')">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                        <circle cx="12" cy="13" r="3"/>
                    </svg>
                    Camera
                </button>
                <button onclick="sendMedia('video')">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                    Video
                </button>
                <button onclick="sendMedia('document')">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                    </svg>
                    Document
                </button>
                <button onclick="sendMedia('location')">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path d="M12 22s-8-4-8-10V5l8-3 8 3v7c0 6-8 10-8 10z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    Location
                </button>
                <button onclick="sendMedia('file')">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path d="M13 4a1 1 0 011 1v4a1 1 0 01-1 1H9a1 1 0 01-1-1V5a1 1 0 011-1h4z"/>
                        <path d="M13 4v4a1 1 0 001 1h4"/>
                        <path d="M7 8v10a2 2 0 002 2h6a2 2 0 002-2V8"/>
                    </svg>
                    File
                </button>
            </div>
        </div>

        <!-- Photo Viewer -->
        <div id="photo-viewer">
            <div class="viewer-actions">
                <button onclick="closePhotoViewer()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                    </svg>
                    Back
                </button>
                <button class="save-btn" onclick="savePhoto()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                    </svg>
                    Save
                </button>
            </div>
            <img id="viewer-image" src="" alt="Photo" />
        </div>

        <!-- Document Viewer -->
        <div id="document-viewer">
            <div class="doc-viewer-header">
                <button onclick="closeDocumentViewer()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                    </svg>
                    Close
                </button>
                <button onclick="downloadDocument()" class="save-btn" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);color:white;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                    </svg>
                    Download
                </button>
            </div>
            <div class="doc-viewer-content" id="doc-viewer-content">
                <div class="doc-viewer-loading">Loading document...</div>
            </div>
        </div>

        <!-- Call Overlay -->
        <div id="call-overlay" class="call-overlay">
            <div style="text-align:center;">
                <img id="call-avatar" src="" alt="Caller" class="call-avatar" />
                <div class="call-name" id="call-name">User</div>
                <div class="call-status" id="call-status">Connecting...</div>
                <div class="call-duration" id="call-duration">00:00</div>
            </div>

            <div id="incoming-call-actions" class="call-bottom-actions">
                <button class="call-control accept" onclick="acceptCall()">
                    <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                    </svg>
                </button>
                <button class="end-call" onclick="rejectCall()">
                    <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">

            <div class="call-bottom-actions" id="call-controls">
                <button class="call-control" onclick="toggleCallMute()" id="call-mute-btn">

                        <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>

                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>

                <button class="end-call" onclick="endCall()">
                    <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">

                    </svg>
