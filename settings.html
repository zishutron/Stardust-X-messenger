<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Settings - Stardust X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #00A86B;
            --primary-light: #00C97A;
            --primary-dark: #008A56;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F5F9F7;
            --bg-surface: #ECF5F0;
            --bg-input: #F0F7F3;
            --text-primary: #1A2E24;
            --text-secondary: #4A6A5A;
            --text-muted: #8AAA9A;
            --border-color: #D4E8DE;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.25s ease;
            --danger: #EF4444;
        }

        .dark-mode {
            --bg-primary: #1A1A2E;
            --bg-secondary: #0F0F1A;
            --bg-surface: #2A2A44;
            --bg-input: #22223A;
            --text-primary: #F0F0F5;
            --text-secondary: #B0B0C8;
            --text-muted: #7A7A94;
            --border-color: #33334A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .scrollbar-custom::-webkit-scrollbar { width: 3px; }
        .scrollbar-custom::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-custom::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        #app {
            max-width: 430px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 168, 107, 0.05);
        }

        .app-header {
            background: var(--bg-primary);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 54px;
        }
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .app-header .logo .icon {
            width: 34px;
            height: 34px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .app-header .logo .icon svg { width: 22px; height: 22px; }
        .app-header .logo .brand {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .app-header .logo .brand .x { color: var(--primary); }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .header-actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-actions button:active {
            background: var(--bg-surface);
            color: var(--primary);
        }

        .bottom-nav {
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 4px 0 8px;
            flex-shrink: 0;
            min-height: 56px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 12px;
            transition: var(--transition);
            font-size: 9px;
            font-weight: 500;
            min-width: 50px;
            position: relative;
        }
        .nav-item svg { width: 24px; height: 24px; transition: var(--transition); }
        .nav-item.active { color: var(--primary); }
        .nav-item.active svg { transform: translateY(-2px); }

        .settings-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px;
        }
        .settings-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-size: 15px;
            color: var(--text-primary);
        }
        .settings-item:active { background: var(--bg-surface); }
        .settings-item .icon {
            color: var(--text-secondary);
            width: 24px;
            text-align: center;
            font-size: 18px;
        }
        .settings-item .label { flex: 1; }
        .settings-item .arrow { color: var(--text-muted); }
        .settings-item.danger { color: var(--danger); }
        .settings-divider {
            height: 1px;
            background: var(--border-color);
            margin: 4px 16px;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            animation: toastIn 0.3s ease-out;
            max-width: 90%;
            text-align: center;
            font-size: 14px;
            display: none;
            font-weight: 500;
        }
        .toast.active { display: block; }
        @keyframes toastIn {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        #loading {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading .brand {
            margin-top: 16px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        #loading .brand .x { color: var(--primary); }

        /* ===== MODAL STYLES ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 20px;
            animation: fadeIn 0.2s ease-out;
        }
        .modal-overlay.hidden { display: none; }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .modal-box {
            background: var(--bg-primary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-box .modal-header h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .modal-box .modal-header button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: var(--transition);
            font-size: 18px;
        }
        .modal-box .modal-header button:active { background: var(--bg-surface); }

        .modal-box .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .modal-box .contact-item:active { background: var(--bg-surface); }
        .modal-box .contact-item .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
            background: var(--bg-surface);
            flex-shrink: 0;
        }
        .modal-box .contact-item .info {
            flex: 1;
            min-width: 0;
        }
        .modal-box .contact-item .info .name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }
        .modal-box .contact-item .info .uid {
            font-size: 12px;
            color: var(--text-muted);
            font-family: monospace;
        }
        .modal-box .contact-item .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .modal-box .contact-item .btn-action:active { transform: scale(0.95); }
        .modal-box .contact-item .btn-action.danger {
            background: var(--danger);
        }
        .modal-box .contact-item .btn-action.danger:hover {
            background: #DC2626;
        }

        .empty-state-modal {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
        }
        .empty-state-modal .icon {
            font-size: 40px;
            opacity: 0.3;
            margin-bottom: 8px;
        }
        .empty-state-modal .title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .empty-state-modal .sub {
            font-size: 13px;
        }

        @media (max-width: 430px) { #app { max-width: 100%; border-radius: 0; } }
        @media (max-width: 380px) {
            .nav-item { min-width: 40px; font-size: 8px; }
            .nav-item svg { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>

    <!-- Loading -->
    <div id="loading">
        <div class="spinner"></div>
        <div class="brand">Stardust <span class="x">X</span></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <span id="toast-message">Success!</span>
    </div>

    <!-- App -->
    <div id="app">
        <header class="app-header">
            <div class="logo" onclick="window.location.href='chat.html'">
                <div class="icon">
                    <svg viewBox="0 0 40 40" fill="none">
                        <rect x="4" y="4" width="32" height="32" rx="8" fill="white" />
                        <path d="M12 20 L18 26 L30 14" stroke="#00A86B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 14 L28 14 L28 20" stroke="#00A86B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="brand">Stardust <span class="x">X</span></span>
            </div>
            <div class="header-actions">
                <button onclick="showToast('Search settings')" aria-label="Search">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/>
                    </svg>
                </button>
            </div>
        </header>

        <div class="settings-content scrollbar-custom">
            <button class="settings-item" onclick="window.location.href='profile.html'">
                <span class="icon">👤</span>
                <span class="label">Edit Profile</span>
                <span class="arrow">›</span>
            </button>
            <button class="settings-item" onclick="openBlockedContacts()">
                <span class="icon">🚫</span>
                <span class="label">Blocked Contacts</span>
                <span class="arrow">›</span>
            </button>
            <button class="settings-item" onclick="openCloseFriends()">
                <span class="icon">⭐</span>
                <span class="label">Close Friends</span>
                <span class="arrow">›</span>
            </button>
            <button class="settings-item" onclick="toggleDarkMode()">
                <span class="icon">🌓</span>
                <span class="label" id="dark-mode-label">Dark Mode</span>
                <span class="arrow">›</span>
            </button>
            <button class="settings-item" onclick="openCustomerSupport()">
                <span class="icon">✉</span>
                <span class="label">Customer Support</span>
                <span class="arrow">›</span>
            </button>
            <div class="settings-divider"></div>
            <button class="settings-item" onclick="window.open('about.html','_blank')">
                <span class="icon">ℹ</span>
                <span class="label">About Us</span>
                <span class="arrow">›</span>
            </button>
            <button class="settings-item" onclick="window.open('privacy.html','_blank')">
                <span class="icon">🔒</span>
                <span class="label">Privacy Policy</span>
                <span class="arrow">›</span>
            </button>
            <button class="settings-item" onclick="window.open('terms.html','_blank')">
                <span class="icon">📜</span>
                <span class="label">Terms of Service</span>
                <span class="arrow">›</span>
            </button>
            <div class="settings-divider"></div>
            <button class="settings-item" onclick="logoutUser()">
                <span class="icon">🚪</span>
                <span class="label">Logout</span>
                <span class="arrow">›</span>
            </button>
            <button class="settings-item danger" onclick="deleteAccount()">
                <span class="icon">🗑</span>
                <span class="label">Delete Account</span>
                <span class="arrow">›</span>
            </button>
        </div>

        <!-- Blocked Contacts Modal -->
        <div id="blocked-contacts-modal" class="modal-overlay hidden">
            <div class="modal-box">
                <div class="modal-header">
                    <h3>Blocked Contacts</h3>
                    <button onclick="closeModal('blocked-contacts-modal')">✕</button>
                </div>
                <div id="blocked-list">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </div>

        <!-- Close Friends Modal -->
        <div id="close-friends-modal" class="modal-overlay hidden">
            <div class="modal-box">
                <div class="modal-header">
                    <h3>Close Friends</h3>
                    <button onclick="closeModal('close-friends-modal')">✕</button>
                </div>
                <div id="close-friends-list">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item" data-tab="chats" onclick="window.location.href='chat.html'">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
                <span>Chats</span>
            </button>
            <button class="nav-item" data-tab="contacts" onclick="window.location.href='contacts.html'">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
                <span>Contacts</span>
            </button>
        </nav>
    </div>

    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyC0v1HVCDfyO-nFdBJChpcB3ZxDOlCtFuQ",
            authDomain: "stardust-chat-1656d.firebaseapp.com",
            databaseURL: "https://stardust-chat-1656d-default-rtdb.firebaseio.com",
            projectId: "stardust-chat-1656d",
            storageBucket: "stardust-chat-1656d.firebasestorage.app",
            messagingSenderId: "676902329820",
            appId: "1:676902329820:web:576bb7bc0e6c9d3e0c4319",
            measurementId: "G-31GVGLYZDL"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // ================================================================
        // STATE
        // ================================================================
        let currentUser = null;
        let uid = null;
        let darkMode = false;
        let blockedList = [];
        let closeFriendsList = [];

        // ================================================================
        // TOAST
        // ================================================================
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = message;
            toast.style.background = isError ? '#EF4444' : 'var(--text-primary)';
            toast.style.color = 'white';
            toast.classList.add('active');
            if (window.toastTimeout) clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                toast.classList.remove('active');
                toast.style.background = 'var(--text-primary)';
            }, 4000);
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // ================================================================
        // DARK MODE
        // ================================================================
        function applyDarkMode() {
            const saved = localStorage.getItem('stardust-dark-mode');
            if (saved === 'true') {
                darkMode = true;
                document.body.classList.add('dark-mode');
                document.getElementById('dark-mode-label').textContent = 'Dark Mode (On)';
            }
        }
        applyDarkMode();

        function toggleDarkMode() {
            darkMode = !darkMode;
            document.body.classList.toggle('dark-mode', darkMode);
            localStorage.setItem('stardust-dark-mode', darkMode ? 'true' : 'false');
            const label = document.getElementById('dark-mode-label');
            label.textContent = darkMode ? 'Dark Mode (On)' : 'Dark Mode';
            showToast(darkMode ? 'Dark mode enabled' : 'Light mode enabled');
        }

        // ================================================================
        // CUSTOMER SUPPORT
        // ================================================================
        function openCustomerSupport() {
            const email = 'support.stardustofficial@gmail.com';
            const subject = 'Stardust X Support Request';
            const body = 'Hello Stardust X Team,\n\nI need help with...\n\nRegards,\n[Your Name]';
            window.location.href = 'mailto:' + email + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(
                body);
        }

        // ================================================================
        // AUTH CHECK
        // ================================================================
        auth.onAuthStateChanged((user) => {
            document.getElementById('loading').style.display = 'none';

            if (!user) {
                window.location.href = 'auth.html';
                return;
            }

            db.ref('users').orderByChild('email').equalTo(user.email)
                .once('value')
                .then((snap) => {
                    const data = snap.val();
                    if (data) {
                        const keys = Object.keys(data);
                        for (let k of keys) {
                            if (data[k].email === user.email) {
                                currentUser = data[k];
                                uid = k;
                                blockedList = data[k].blocked || [];
                                closeFriendsList = data[k].closeFriends || [];
                                break;
                            }
                        }
                    }
                    if (currentUser) {
                        showToast('Welcome to Settings');
                    }
                });
        });

        // ================================================================
        // OPEN BLOCKED CONTACTS - FIXED
        // ================================================================
        function openBlockedContacts() {
            const container = document.getElementById('blocked-list');
            container.innerHTML = '';

            // Get fresh data
            db.ref('users/' + uid + '/blocked').once('value')
                .then((snap) => {
                    blockedList = snap.val() || [];

                    if (blockedList.length === 0) {
                        container.innerHTML = `
                            <div class="empty-state-modal">
                                <div class="icon">🚫</div>
                                <div class="title">No Blocked Contacts</div>
                                <div class="sub">You haven't blocked anyone yet</div>
                            </div>
                        `;
                        document.getElementById('blocked-contacts-modal').classList.remove('hidden');
                        return;
                    }

                    let loadedCount = 0;
                    blockedList.forEach(blockedUID => {
                        db.ref('users/' + blockedUID).once('value').then((snap) => {
                            const user = snap.val();
                            if (!user) {
                                loadedCount++;
                                if (loadedCount === blockedList.length) {
                                    if (container.children.length === 0) {
                                        container.innerHTML = `
                                            <div class="empty-state-modal">
                                                <div class="icon">🚫</div>
                                                <div class="title">No Blocked Contacts</div>
                                                <div class="sub">You haven't blocked anyone yet</div>
                                            </div>
                                        `;
                                    }
                                }
                                return;
                            }

                            const div = document.createElement('div');
                            div.className = 'contact-item';
                            div.innerHTML = `
                                <img src="${user.pfp}" class="avatar" />
                                <div class="info">
                                    <div class="name">${user.name}</div>
                                    <div class="uid">@${user.uid}</div>
                                </div>
                                <button class="btn-action" onclick="unblockUser('${blockedUID}')">Unblock</button>
                            `;
                            container.appendChild(div);

                            loadedCount++;
                            if (loadedCount === blockedList.length && container.children.length === 0) {
                                container.innerHTML = `
                                    <div class="empty-state-modal">
                                        <div class="icon">🚫</div>
                                        <div class="title">No Blocked Contacts</div>
                                        <div class="sub">You haven't blocked anyone yet</div>
                                    </div>
                                `;
                            }
                        });
                    });
                })
                .catch((err) => {
                    showToast('Error loading blocked contacts: ' + err.message, true);
                    container.innerHTML = `
                        <div class="empty-state-modal">
                            <div class="icon">❌</div>
                            <div class="title">Error Loading</div>
                            <div class="sub">${err.message}</div>
                        </div>
                    `;
                });

            document.getElementById('blocked-contacts-modal').classList.remove('hidden');
        }

        // ================================================================
        // UNBLOCK USER - FIXED
        // ================================================================
        function unblockUser(blockedUID) {
            if (!confirm('Unblock this user?')) return;

            // Remove from blocked list
            const newBlocked = blockedList.filter(uid => uid !== blockedUID);

            db.ref('users/' + uid + '/blocked').set(newBlocked)
                .then(() => {
                    blockedList = newBlocked;
                    showToast('User unblocked successfully');
                    // Refresh the blocked list
                    openBlockedContacts();
                    // Also update contacts - add back if needed
                    db.ref('users/' + uid + '/contacts').once('value').then((snap) => {
                        const contacts = snap.val() || [];
                        if (!contacts.includes(blockedUID)) {
                            contacts.push(blockedUID);
                            db.ref('users/' + uid + '/contacts').set(contacts);
                        }
                    });
                })
                .catch((err) => {
                    showToast('Error: ' + err.message, true);
                });
        }

        // ================================================================
        // OPEN CLOSE FRIENDS - FIXED
        // ================================================================
        function openCloseFriends() {
            const container = document.getElementById('close-friends-list');
            container.innerHTML = '';

            // Get fresh data
            db.ref('users/' + uid + '/closeFriends').once('value')
                .then((snap) => {
                    closeFriendsList = snap.val() || [];

                    if (closeFriendsList.length === 0) {
                        container.innerHTML = `
                            <div class="empty-state-modal">
                                <div class="icon">⭐</div>
                                <div class="title">No Close Friends</div>
                                <div class="sub">Add people to your close friends list</div>
                            </div>
                        `;
                        document.getElementById('close-friends-modal').classList.remove('hidden');
                        return;
                    }

                    let loadedCount = 0;
                    closeFriendsList.forEach(friendUID => {
                        db.ref('users/' + friendUID).once('value').then((snap) => {
                            const user = snap.val();
                            if (!user) {
                                loadedCount++;
                                if (loadedCount === closeFriendsList.length) {
                                    if (container.children.length === 0) {
                                        container.innerHTML = `
                                            <div class="empty-state-modal">
                                                <div class="icon">⭐</div>
                                                <div class="title">No Close Friends</div>
                                                <div class="sub">Add people to your close friends list</div>
                                            </div>
                                        `;
                                    }
                                }
                                return;
                            }

                            const div = document.createElement('div');
                            div.className = 'contact-item';
                            div.onclick = () => {
                                closeModal('close-friends-modal');
                                window.location.href = 'chat.html?uid=' + friendUID;
                            };
                            div.innerHTML = `
                                <img src="${user.pfp}" class="avatar" />
                                <div class="info">
                                    <div class="name">${user.name} ⭐</div>
                                    <div class="uid">@${user.uid}</div>
                                </div>
                                <button class="btn-action danger" onclick="event.stopPropagation();removeCloseFriend('${friendUID}')">Remove</button>
                            `;
                            container.appendChild(div);

                            loadedCount++;
                            if (loadedCount === closeFriendsList.length && container.children.length === 0) {
                                container.innerHTML = `
                                    <div class="empty-state-modal">
                                        <div class="icon">⭐</div>
                                        <div class="title">No Close Friends</div>
                                        <div class="sub">Add people to your close friends list</div>
                                    </div>
                                `;
                            }
                        });
                    });
                })
                .catch((err) => {
                    showToast('Error loading close friends: ' + err.message, true);
                    container.innerHTML = `
                        <div class="empty-state-modal">
                            <div class="icon">❌</div>
                            <div class="title">Error Loading</div>
                            <div class="sub">${err.message}</div>
                        </div>
                    `;
                });

            document.getElementById('close-friends-modal').classList.remove('hidden');
        }

        // ================================================================
        // REMOVE CLOSE FRIEND - FIXED
        // ================================================================
        function removeCloseFriend(friendUID) {
            if (!confirm('Remove this user from close friends?')) return;

            const newCloseFriends = closeFriendsList.filter(uid => uid !== friendUID);

            db.ref('users/' + uid + '/closeFriends').set(newCloseFriends)
                .then(() => {
                    closeFriendsList = newCloseFriends;
                    showToast('Removed from close friends');
                    openCloseFriends();
                })
                .catch((err) => {
                    showToast('Error: ' + err.message, true);
                });
        }

        // ================================================================
        // LOGOUT & DELETE
        // ================================================================
        function logoutUser() {
            if (confirm('Are you sure you want to logout?')) {
                auth.signOut().then(() => {
                    window.location.href = 'auth.html';
                });
            }
        }

        function deleteAccount() {
            if (!confirm('Are you sure you want to delete your account? This cannot be undone!')) return;

            const user = auth.currentUser;
            if (!user) return;

            db.ref('users/' + uid).remove()
                .then(() => {
                    return user.delete();
                })
                .then(() => {
                    showToast('Account deleted');
                    window.location.href = 'auth.html';
                })
                .catch((err) => {
                    showToast('Error: ' + err.message, true);
                });
        }

        // ================================================================
        // CLICK OUTSIDE MODALS
        // ================================================================
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) {
                e.target.classList.add('hidden');
            }
        });

        console.log('🚀 Stardust X - Settings Page (Complete Fix)');
        console.log('✅ Blocked Contacts opens properly');
        console.log('✅ Close Friends opens properly');
        console.log('✅ Unblock works');
        console.log('✅ Remove Close Friend works');
    </script>
</body>
</html>
